<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./i18n.js"></script><script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./theme-dark.css">
<style>
.sv-t p{margin:0}.sv-t ul,.sv-t ol{margin:0;padding-left:1.1em}.sv-t li{margin:0.15em 0}
.se-ed:focus{outline:none}
[data-thumbpanel] [draggable="true"]{content-visibility:auto;contain-intrinsic-height:auto 84px}
</style>
</helmet>
<div data-edroot="1" tabIndex="-1" onKeyDown="{{ onRootKey }}" style="height:100%;display:flex;flex-direction:column;min-height:0;background:transparent;position:relative;outline:none;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;color:var(--k1, #1D1D1F)">
  <sc-if value="{{ notPure }}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;top:10px;left:{{ barL }};right:{{ barR }};z-index:40;display:flex;justify-content:{{ barJ }};pointer-events:none"><div data-glass-bar="1" style="pointer-events:auto;max-width:100%;min-width:0;flex:0 1 auto;display:flex;align-items:center;gap:1px;padding:4px;border-radius:999px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1))"><div style="width:{{ spW }};flex:none;display:{{ spD }};align-items:center;justify-content:flex-end;align-self:stretch"><span style="width:1px;height:18px;background:var(--k36, rgba(0,0,0,0.12));margin-right:4px"></span></div>
    <div style="display:flex;align-items:center;gap:1px;min-width:0;overflow-x:auto;scrollbar-width:none">
    <button onMouseDown="{{ md }}" onClick="{{ fileMenu }}" style="height:34px;padding:0 13px;border:none;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--k1, #1D1D1F);transition:background .25s ease,box-shadow .25s ease,transform .35s cubic-bezier(.2,1.4,.4,1);background:transparent" style-hover="background:var(--k30, rgba(255,255,255,0.6))" style-active="transform:scale(0.94)">文件</button>
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <button onMouseDown="{{ md }}" onClick="{{ t.onClick }}" style="height:34px;padding:0 13px;border:none;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--k1, #1D1D1F);transition:background .25s ease,box-shadow .25s ease,transform .35s cubic-bezier(.2,1.4,.4,1);background:{{ t.bg }};box-shadow:{{ t.line }};font-weight:{{ t.weight }}" style-hover="background:var(--k30, rgba(255,255,255,0.6))" style-active="transform:scale(0.94)">{{ t.label }}</button>
    </sc-for>
    </div><div style="display:flex;align-items:center;flex:none"><span style="width:1px;height:18px;background:var(--k60, rgba(0,0,0,0.14));margin:0 4px;flex:none"></span><button onMouseDown="{{ md }}" onClick="{{ aiClick }}" data-ai-btn="1" title="AI 助手" style="height:34px;padding:0 13px 0 11px;border:none;border-radius:999px;background:{{ aiBg }};box-shadow:{{ aiSh }};cursor:pointer;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--k1, #1D1D1F);white-space:nowrap;flex:none;transition:background .25s,box-shadow .25s,transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--k20, rgba(255,255,255,0.7))" style-active="transform:scale(0.95)"><span style="font-size:13px;line-height:1">✦</span>AI</button><button onMouseDown="{{ md }}" onClick="{{ playFromStart }}" title="放映 F5" style="height:34px;padding:0 13px;border:none;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--k1, #1D1D1F);background:transparent;display:flex;align-items:center;gap:7px;flex:none;transition:background .25s,transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--k30, rgba(255,255,255,0.6))" style-active="transform:scale(0.94)"><span style="width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid var(--k7, #1D1D1F)"></span>放映</button></div>
  </div></div>
  <sc-if value="{{ bubbleOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:58px;left:{{ rbx }};z-index:39;width:0;height:0;overflow:visible"><div data-bubble="1" data-pop="{{ tabKey }}" style="position:absolute;left:0;top:0;translate:-50% 0;z-index:39;flex:none;width:max-content;max-width:{{ bMax }};transform-origin:top center;padding:8px 10px;border-radius:22px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;transform-origin:top left">
      <sc-for list="{{ ribbon }}" as="it" hint-placeholder-count="12">
        <sc-if value="{{ it.isSep }}" hint-placeholder-val="{{ false }}"><span style="width:1px;height:20px;background:var(--k36, rgba(0,0,0,0.12));margin:0 6px;flex:none"></span></sc-if>
        <sc-if value="{{ it.isBtn }}" hint-placeholder-val="{{ true }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:30px;min-width:30px;padding:0 8px;border:none;border-radius:6px;background:{{ it.bg }};font-size:13px;font-weight:{{ it.fw }};font-style:{{ it.fs }};text-decoration:{{ it.td }};color:{{ it.color }};cursor:pointer;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px" style-hover="background:var(--k20, rgba(255,255,255,0.7))">
            <sc-if value="{{ it.hasSw }}" hint-placeholder-val="{{ false }}"><span style="width:14px;height:14px;border-radius:3px;background:{{ it.sw }};box-shadow:inset 0 0 0 1px var(--k76, rgba(0,0,0,0.15))"></span></sc-if>{{ it.label }}
          </button>
        </sc-if>
        <sc-if value="{{ it.isAlign }}" hint-placeholder-val="{{ false }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:30px;width:30px;border:none;border-radius:6px;background:{{ it.bg }};cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:{{ it.ai }};gap:2.5px;padding:0 8px;flex:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">
            <span style="height:1.6px;width:14px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:9px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:14px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:8px;background:var(--k7, #1D1D1F)"></span>
          </button>
        </sc-if>
        <sc-if value="{{ it.isSel }}" hint-placeholder-val="{{ false }}">
          <select data-val="{{ it.value }}" title="{{ it.title }}" value="{{ it.value }}" onChange="{{ it.onChange }}" style="height:28px;padding:0 4px;border:1px solid var(--k17, rgba(0,0,0,0.07));border-radius:9px;background:var(--k30, rgba(255,255,255,0.6));font-size:12.5px;width:{{ it.w }};flex:none;margin:0 2px">
            <sc-for list="{{ it.options }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}">{{ o.l }}</option></sc-for>
          </select>
        </sc-if>
        <sc-if value="{{ it.isColor }}" hint-placeholder-val="{{ false }}">
          <label title="{{ it.title }}" style="position:relative;height:30px;min-width:32px;padding:0 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;flex:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">
            <span style="font-size:13px;line-height:1.1;font-weight:{{ it.fw }};white-space:nowrap">{{ it.label }}</span>
            <span style="width:18px;height:3.5px;border-radius:1px;background:{{ it.swatch }};margin-top:2px;box-shadow:inset 0 0 0 0.5px var(--k56, rgba(0,0,0,0.25))"></span>
            <input type="color" value="{{ it.value }}" onChange="{{ it.onChange }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0">
          </label>
        </sc-if>
        <sc-if value="{{ it.isMenu }}" hint-placeholder-val="{{ false }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onToggle }}" style="height:30px;padding:0 8px;border:none;border-radius:6px;background:{{ it.bg }};font-size:13px;cursor:pointer;white-space:nowrap;flex:none;display:flex;align-items:center;gap:4px" style-hover="background:var(--k20, rgba(255,255,255,0.7))">{{ it.label }}<span style="font-size:9px;color:var(--k8, #8E8E93)">▼</span></button>
        </sc-if>
        <sc-if value="{{ it.isRange }}" hint-placeholder-val="{{ false }}">
          <label title="{{ it.title }}" style="height:30px;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:12.5px;color:var(--k11, #6E6E73);flex:none;white-space:nowrap">{{ it.label }}<input type="range" min="{{ it.min }}" max="{{ it.max }}" step="1" value="{{ it.value }}" onChange="{{ it.onChange }}" style="width:84px;accent-color:var(--k1, #1D1D1F)"><span style="min-width:26px;text-align:right;font-variant-numeric:tabular-nums;color:var(--k1, #1D1D1F)">{{ it.text }}</span></label>
        </sc-if>
      </sc-for>
    </div></div>
  </sc-if>

  </sc-if>
  <div style="flex:1;min-height:0;display:grid;grid-template-columns:{{ bodyCols }};transition:grid-template-columns .55s cubic-bezier(.2,1,.3,1)">
    <sc-if value="{{ showThumbs }}" hint-placeholder-val="{{ true }}">
    <div data-thumbpanel="1" data-pop="left" style="position:absolute;top:10px;left:10px;bottom:10px;width:204px;z-index:45;display:flex;flex-direction:column;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--k32, rgba(255,255,255,0.5)),var(--k33, rgba(255,255,255,0.32)));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k34, rgba(255,255,255,0.9)),0 14px 40px var(--k19, rgba(0,0,0,0.1))"><div style="height:46px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 10px 0 18px"><button onClick="{{ closeThumbs }}" title="关闭" style="width:26px;height:26px;border:none;border-radius:999px;background:transparent;font-size:11px;color:var(--k11, #6E6E73);cursor:pointer;transition:transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--k31, rgba(255,255,255,0.95))" style-active="transform:scale(0.88)">✕</button></div><div style="flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;padding:0 14px 16px 8px;display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="4">
        <div draggable="true" onDragStart="{{ t.onDragStart }}" onDragOver="{{ t.onDragOver }}" onDrop="{{ t.onDrop }}" onDragEnd="{{ t.onDragEnd }}" onClick="{{ t.onClick }}" onContextMenu="{{ t.onCtx }}" style="flex:none;display:grid;grid-template-columns:18px 144px;gap:8px;cursor:pointer;box-shadow:{{ t.dropLine }};opacity:{{ t.op }}">
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--k8, #8E8E93);padding-top:1px">
            <span>{{ t.n }}</span>
            <sc-if value="{{ t.hasAnim }}" hint-placeholder-val="{{ false }}"><span style="font-size:10px;color:var(--k35, #3F7D5C)">✦</span></sc-if>
          </div>
          <div style="border-radius:5px;overflow:hidden;outline:{{ t.outline }};outline-offset:2px;box-shadow:0 1px 3px var(--k77, rgba(0,0,0,0.14));position:relative;pointer-events:none">
            <dc-import name="SlideView" slide="{{ t.slide }}" theme="{{ themeKey }}" ratio="{{ ratio }}" width="{{ 144 }}" hint-size="144px,81px"></dc-import>
            <sc-if value="{{ t.hidden }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:rgba(246,244,239,0.6);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--k11, #6E6E73)">已隐藏</div></sc-if>
          </div>
        </div>
      </sc-for>
      <button onClick="{{ addSlideQuick }}" style="flex:none;margin-left:26px;height:34px;border:1px dashed var(--k78, rgba(0,0,0,0.2));border-radius:12px;background:transparent;font-size:12.5px;color:var(--k11, #6E6E73);cursor:pointer" style-hover="background:#EFEFF4">＋ 新幻灯片</button>
    </div></div>
    </sc-if>

    <div style="grid-column:2;display:flex;flex-direction:column;min-width:0;min-height:0;padding-top:58px">
      <div ref="{{ stageRef }}" onMouseDown="{{ onStageDown }}" style="flex:1;min-height:0;position:relative;overflow:auto;display:flex">
        <div ref="{{ slideRef }}" style="position:relative;width:{{ stW }};height:{{ stH }};flex:none;margin:auto;box-shadow:0 1px 2px var(--k53, rgba(0,0,0,0.08)),0 12px 36px var(--k22, rgba(0,0,0,0.12))">
          <div style="position:absolute;left:0;top:0;width:1600px;height:{{ H }};transform:{{ scale }};transform-origin:0 0;background:{{ sBg }};overflow:hidden">
            <sc-for list="{{ objs }}" as="o" hint-placeholder-count="0">
              <div data-soid="{{ o.id }}" onMouseDown="{{ o.onMD }}" onDoubleClick="{{ o.onDbl }}" style="position:absolute;left:{{ o.left }};top:{{ o.top }};width:{{ o.width }};height:{{ o.height }};transform:{{ o.tf }};opacity:{{ o.op }};cursor:{{ o.cursor }};pointer-events:{{ o.pe }}">
                <div style="position:absolute;inset:0;background:{{ o.bg }};border-radius:{{ o.radius }};clip-path:{{ o.clip }};box-shadow:{{ o.stroke }}"></div>
                <sc-if value="{{ o.isImg }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;inset:0;pointer-events:none;{{ o.picFrame }}"><img src="{{ o.src }}" alt="" draggable="false" style="{{ o.picImage }}"></div>
                </sc-if>
                <sc-if value="{{ o.hasText }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;inset:0;padding:{{ o.pad }};display:flex;flex-direction:column;justify-content:{{ o.va }};color:{{ o.color }};font-size:{{ o.fs }};font-family:{{ o.font }};font-weight:{{ o.fw }};font-style:{{ o.fst }};text-decoration:{{ o.td }};text-align:{{ o.align }};line-height:{{ o.lh }};overflow:{{ o.ovf }};word-break:break-word;outline:{{ o.phLine }}">
                    <div class="sv-t se-ed" data-edit="{{ o.id }}" contentEditable="{{ o.ce }}" suppressContentEditableWarning="{{ true }}" onBlur="{{ o.onBlur }}" dangerouslySetInnerHTML="{{ o.inner }}" style="min-height:1em;cursor:{{ o.tcur }};user-select:{{ o.us }};outline:none"></div>
                  </div>
                </sc-if>
                <sc-if value="{{ o.isTable }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;inset:0;display:flex;flex-direction:column;font-size:{{ o.fs }};font-family:{{ o.font }}">
                    <sc-for list="{{ o.trows }}" as="r" hint-placeholder-count="0">
                      <div style="flex:1;display:flex;min-height:0">
                        <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="0">
                          <div data-edit="{{ c.key }}" contentEditable="{{ o.ce }}" suppressContentEditableWarning="{{ true }}" onBlur="{{ c.onBlur }}" style="flex:1;display:flex;align-items:center;padding:0 16px;background:{{ c.bg }};color:{{ c.color }};font-weight:{{ c.fw }};border-bottom:1px solid rgba(128,128,128,0.25);overflow:hidden;outline:none;cursor:{{ o.tcur }}">{{ c.text }}</div>
                        </sc-for>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ o.hasBadge }}" hint-placeholder-val="{{ false }}">
                  <span style="position:absolute;left:-4px;top:-4px;transform:translate(-100%,0);min-width:{{ badge }};height:{{ badge }};padding:0 6px;border-radius:4px;background:var(--k59, #3F7D5C);color:#fff;font-size:{{ badgeFs }};display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif">{{ o.badge }}</span>
                </sc-if>
              </div>
            </sc-for>
            <sc-if value="{{ gV }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:800px;top:0;bottom:0;border-left:{{ guideW }} dashed #D9534F;pointer-events:none"></div></sc-if>
            <sc-if value="{{ gH }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:{{ halfH }};left:0;right:0;border-top:{{ guideW }} dashed #D9534F;pointer-events:none"></div></sc-if>
          </div>
          <div style="position:absolute;left:0;top:0;width:1600px;height:{{ H }};transform:{{ scale }};transform-origin:0 0;pointer-events:none">
            <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:{{ fr.left }};top:{{ fr.top }};width:{{ fr.width }};height:{{ fr.height }};transform:{{ fr.tf }};outline:{{ fr.line }};outline-offset:0">
                <sc-for list="{{ handles }}" as="h" hint-placeholder-count="0">
                  <span onMouseDown="{{ h.onMD }}" style="position:absolute;left:{{ h.left }};top:{{ h.top }};width:{{ hs }};height:{{ hs }};transform:translate(-50%,-50%);background:var(--k0, #FFFFFF);border:{{ hb }} solid var(--k59, #3F7D5C);border-radius:{{ h.radius }};cursor:{{ h.cursor }};pointer-events:auto;box-sizing:border-box"></span>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </div>
        <sc-if value="{{ noSlides }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--k11, #6E6E73)">没有幻灯片 · 点击左侧「＋ 新幻灯片」</div>
        </sc-if>
      </div>
      <sc-if value="{{ showNotes }}" hint-placeholder-val="{{ true }}">
        <div style="flex:none;height:84px;margin:0 16px 4px;border-radius:18px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1));display:flex;flex-direction:column">
          <textarea value="{{ notes }}" onChange="{{ onNotes }}" placeholder="单击此处添加备注" style="flex:1;border:none;background:transparent;resize:none;padding:10px 18px;font-size:13px;line-height:1.6;outline:none;color:var(--k1, #1D1D1F)"></textarea>
        </div>
      </sc-if>
      <sc-if value="{{ notPure }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;height:34px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:999px;background:var(--k69, rgba(255,255,255,0.38));backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k64, rgba(255,255,255,0.85)),0 6px 20px var(--k53, rgba(0,0,0,0.08));font-size:12.5px;color:var(--k11, #6E6E73);opacity:0.32;transition:opacity .45s cubic-bezier(.2,1,.3,1),background .45s;white-space:nowrap" style-hover="opacity:1;background:var(--k15, rgba(255,255,255,0.62))">
        <span>{{ statusText }}</span>
        <div style="flex:1"></div>
        <div style="display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-left:1px solid var(--k36, rgba(0,0,0,0.12));border-right:1px solid var(--k36, rgba(0,0,0,0.12))">
          <button onClick="{{ zoomOut }}" title="缩小 Ctrl+−" style="border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--k11, #6E6E73);width:20px">−</button>
          <input type="range" min="20" max="400" step="1" value="{{ zoomPct }}" onChange="{{ onZoom }}" title="{{ zoomPct }}%" style="width:100px;accent-color:var(--k1, #1D1D1F)">
          <button onClick="{{ zoomIn }}" title="放大 Ctrl+＋" style="border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--k11, #6E6E73);width:20px">＋</button>
          <input value="{{ zoomText }}" onChange="{{ onZoomText }}" onKeyDown="{{ onZoomKey }}" onFocus="{{ onZoomFocus }}" onBlur="{{ onZoomBlur }}" title="输入缩放比例后回车（20–400，100 = 适应窗口）" style="width:46px;height:22px;padding:0;border:none;border-radius:6px;background:transparent;font:inherit;color:inherit;text-align:center;outline:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">
          <button onClick="{{ fitZoom }}" title="适应窗口 Ctrl+0" style="border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--k11, #6E6E73)">适应窗口</button>
        </div>
        <button onClick="{{ toggleNotes }}" style="border:none;background:transparent;font-size:12px;cursor:pointer;color:var(--k11, #6E6E73)">{{ notesLabel }}</button>
      </div>
      </sc-if>
    </div>
  </div>

  <input ref="{{ imgRef }}" type="file" accept="image/*" onChange="{{ onImgFile }}" style="display:none">
