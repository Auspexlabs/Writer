<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./i18n.js"></script><script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./theme-dark.css">
<link rel="stylesheet" href="./assets/fonts/fonts.css">
<style>body{margin:0;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#3F7D5C}a:hover{color:#2E6048}</style>
</helmet>
<div style="width:560px;border-radius:18px;overflow:hidden;background:var(--gwin, linear-gradient(180deg,rgba(255,255,255,0.74),rgba(246,246,248,0.6)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);color:var(--k1, #1D1D1F);box-shadow:inset 0 0 0 1px var(--ghi, rgba(255,255,255,0.75)),0 0 0 0.5px rgba(0,0,0,0.16),0 28px 80px rgba(0,0,0,0.26),0 2px 8px rgba(0,0,0,0.08);font-family:'IBM Plex Sans','Noto Sans SC',sans-serif">
  <div style="height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;position:relative">
    <button data-close="1" onClick="{{ close }}" title="关闭" style="width:12px;height:12px;padding:0;border-radius:50%;border:0.5px solid rgba(0,0,0,0.18);background:#FF5F57;cursor:default"></button>
    <span style="width:12px;height:12px;border-radius:50%;background:var(--goff, rgba(0,0,0,0.1))"></span>
    <span style="width:12px;height:12px;border-radius:50%;background:var(--goff, rgba(0,0,0,0.1))"></span>
    <span style="position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;pointer-events:none">触控板手势</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 18px 14px">
    <sc-for list="{{ rows }}" as="g" hint-placeholder-count="6">
      <div style="display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:13px;background:var(--gcard, rgba(255,255,255,0.55));box-shadow:inset 0 0 0 1px var(--gcardb, rgba(255,255,255,0.8)),0 1px 2px rgba(0,0,0,0.04)">
        <div style="position:relative;height:64px;border-radius:10px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.7)),var(--k16, rgba(255,255,255,0.35)));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 0 0 1px var(--k17, rgba(0,0,0,0.06))">
          <sc-for list="{{ g.dots }}" as="d" hint-placeholder-count="2">
            <span style="position:absolute;left:{{ d.x }};top:{{ d.y }};width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:{{ accent }};opacity:0.85;box-shadow:0 0 0 5px rgba(63,125,92,0.14)"></span>
          </sc-for>
          <span style="position:absolute;right:10px;bottom:6px;font-size:12px;color:var(--k8, #8E8E93)">{{ g.arrow }}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:3px">
          <span style="font-size:13px;font-weight:600">{{ g.name }}</span>
          <span style="font-size:12px;color:var(--k11, #6E6E73);line-height:1.5;text-wrap:pretty">{{ g.desc }}</span>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="padding:0 22px 18px;font-size:11.5px;color:var(--k8, #8E8E93)">可在 系统设置 › 触控板 中调整轻点与轻扫的方式。</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:560},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const G = [
  ['双指捏合', '缩放页面、表格与幻灯片。', [[40, 22], [70, 42]], '⤡'],
  ['双指轻点', '打开右键菜单：批注、格式刷、插入。', [[50, 32], [68, 32]], ''],
  ['双指左右轻扫', '在已打开的标签页之间切换。', [[48, 28], [66, 28]], '← →'],
  ['双指从右边缘左扫', '打开或收起 ✦ AI 助手。', [[200, 24], [200, 42]], '←'],
  ['三指轻点', '查询选中词语的释义与翻译。', [[42, 32], [58, 28], [74, 32]], ''],
  ['双指旋转', '旋转选中的图片、形状或 PDF 页面。', [[46, 40], [72, 22]], '↻']
];
class Component extends DCLogic {
  renderVals() {
    let A = '#3F7D5C'; try { A = JSON.parse(localStorage.getItem('writer-settings') || '{}').accent || A; } catch (e) {}
    return {
      accent: A,
      close: () => this.props.onClose && this.props.onClose(),
      rows: G.map(([name, desc, dots, arrow]) => ({ name: $t(name), desc: $t(desc), arrow, dots: dots.map(([x, y]) => ({ x: x + 'px', y: y + 'px' })) }))
    };
  }
}
</script>
</body>
</html>
