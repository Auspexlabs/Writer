<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./i18n.js"></script><script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./theme-dark.css">
<link rel="stylesheet" href="./vendor/katex/katex.min.css">
<link rel="stylesheet" href="./vendor/highlight/github-dark.min.css">
<style>
.pt-ed.code-wrap pre{white-space:pre-wrap;word-break:break-all}
.pt-ed.md-focus>*{transition:opacity .35s ease-out}.pt-ed.md-focus>*:not(.md-cur){opacity:0.28}
.md-lang{height:28px;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:12.5px;font-family:inherit;color:var(--ink, #1D1D1F);padding:0 6px;outline:none;cursor:pointer;max-width:130px}
.pt-ed .md-math-block{margin:10px 0;padding:6px 4px;border-radius:8px;cursor:pointer;overflow-x:auto}
.pt-ed .md-math-block:hover{background:var(--k17, rgba(0,0,0,0.07))}
.pt-ed .md-math{cursor:pointer;border-radius:3px}
.pt-ed .md-math:hover{background:var(--k17, rgba(0,0,0,0.07))}
.pt-ed .md-math-editing{cursor:default;background:var(--k17, rgba(0,0,0,0.07))}
.pt-ed .md-math-editing:hover{background:var(--k17, rgba(0,0,0,0.07))}
.md-math-src{display:block;width:100%;box-sizing:border-box;border:1px solid var(--k36, rgba(0,0,0,0.12));border-radius:6px;background:var(--k0, #FFFFFF);padding:8px 10px;margin:0 0 6px;resize:none;overflow:hidden;outline:none;font-family:'IBM Plex Mono',monospace;font-size:13.5px;line-height:1.6;color:var(--k9, #3A3A3C)}
.md-math-preview{min-height:1.4em;overflow-x:auto}
.md-math-bar{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 6px}
.md-math-bar button{height:26px;min-width:26px;padding:0 7px;border:none;border-radius:8px;background:var(--k17, rgba(0,0,0,0.07));font-size:13px;line-height:1;cursor:pointer;color:var(--k1, #1D1D1F);font-family:'IBM Plex Sans','Noto Sans SC',sans-serif}
.md-math-bar button:hover{background:var(--k36, rgba(0,0,0,0.12))}
.katex-error{cursor:help}
.pt-ed{outline:none;font-family:'Noto Serif SC',serif;font-size:17px;line-height:1.9;color:var(--k1, #1D1D1F);word-break:break-word;caret-color:var(--k1, #1D1D1F)}
.pt-ed>*:first-child{margin-top:0}
.pt-ed h1{font-size:34px;line-height:1.3;font-weight:700;margin:0 0 22px;letter-spacing:0.005em}
.pt-ed h2{font-size:24px;line-height:1.4;font-weight:600;margin:34px 0 12px}
.pt-ed h3{font-size:19px;font-weight:600;margin:26px 0 8px}
.pt-ed h4,.pt-ed h5,.pt-ed h6{font-size:17px;font-weight:600;margin:20px 0 6px}
.pt-ed p{margin:0 0 14px}
.pt-ed a{color:#0A66D8;text-decoration:underline;text-decoration-color:rgba(10,102,216,0.35);text-underline-offset:3px}
.pt-ed strong,.pt-ed b{font-weight:700}
.pt-ed mark{background:rgba(227,178,90,0.35);padding:0 2px;border-radius:3px}
.pt-ed code{font-family:'IBM Plex Mono',monospace;font-size:0.84em;background:var(--k17, rgba(0,0,0,0.07));padding:2px 6px;border-radius:5px}
.pt-ed pre{background:var(--k79, rgba(29,29,31,0.9));color:#FFFFFF;padding:16px 18px;border-radius:14px;overflow:auto;margin:0 0 18px;line-height:1.65;font-size:13.5px;box-shadow:inset 0 1px 0 var(--k80, rgba(255,255,255,0.08))}
.pt-ed pre code{background:none;padding:0;color:inherit;font-size:13.5px}
.pt-ed blockquote{margin:0 0 16px;padding:2px 0 2px 18px;border-left:3px solid var(--k81, rgba(0,0,0,0.45));color:var(--k11, #6E6E73)}
.pt-ed ul,.pt-ed ol{margin:0 0 14px;padding-left:1.5em}
.pt-ed li{margin:3px 0}
.pt-ed li.task{list-style:none;margin-left:-1.4em}
.pt-ed li.task input{margin-right:8px;accent-color:var(--k59, #3F7D5C);cursor:pointer;transform:translateY(2px);width:15px;height:15px}
.pt-ed table{border-collapse:collapse;margin:0 0 18px;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;font-size:14px;background:var(--k82, rgba(255,255,255,0.4));border-radius:10px;overflow:hidden}
.pt-ed th,.pt-ed td{border:1px solid var(--k36, rgba(0,0,0,0.12));padding:8px 12px}
.pt-ed th{background:var(--k42, rgba(255,255,255,0.55));font-weight:600}
.pt-ed hr{border:none;border-top:1px solid var(--k60, rgba(0,0,0,0.14));margin:28px 0}
.pt-ed h1,.pt-ed h2,.pt-ed h3,.pt-ed h4,.pt-ed h5,.pt-ed h6{position:relative}
.pt-ed h1:hover::before,.pt-ed h2:hover::before,.pt-ed h3:hover::before,.pt-ed h4:hover::before,.pt-ed h5:hover::before,.pt-ed h6:hover::before{content:'#';position:absolute;left:-1em;top:0;color:var(--k63, #C7C7CC);font-weight:400;font-size:0.8em;pointer-events:none}
.pt-ed blockquote.md-alert{border-left-color:var(--al, #0969DA);color:inherit;padding-top:6px;padding-bottom:2px}
.pt-ed .md-alert-title{font-weight:600;font-size:15px;color:var(--al, #0969DA);margin:0 0 6px;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif}
.pt-ed .md-alert-note{--al:#0969DA}.pt-ed .md-alert-tip{--al:#1A7F37}.pt-ed .md-alert-important{--al:#8250DF}.pt-ed .md-alert-warning{--al:#9A6700}.pt-ed .md-alert-caution{--al:#CF222E}
.pt-ed sup.md-fn{font-size:0.7em;line-height:0;cursor:help}.pt-ed sup.md-fn a{text-decoration:none;padding:0 2px}
.pt-ed .md-footnotes{margin:28px 0 0;padding-top:12px;border-top:1px solid var(--k60, rgba(0,0,0,0.14));font-size:14px;color:var(--k11, #6E6E73)}.pt-ed .md-footnotes ol{padding-left:1.6em}
.pt-ed .md-front{margin:0 0 24px;padding:12px 16px;border-radius:12px;background:var(--k82, rgba(255,255,255,0.4));border:1px solid var(--k36, rgba(0,0,0,0.12));font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.6;color:var(--k11, #6E6E73);cursor:pointer}
.pt-ed .md-front::before{content:'Front Matter';display:block;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--k8, #8E8E93);margin-bottom:6px}
.pt-ed .md-front pre{background:none;color:inherit;padding:0;margin:0;font-size:13px;box-shadow:none;border-radius:0;white-space:pre-wrap}
.pt-ed .md-front.md-src-editing{cursor:default}.pt-ed .md-front .md-math-src{color:var(--k9, #3A3A3C)}
.pt-ed .md-mermaid{margin:0 0 18px;padding:12px;border-radius:12px;background:var(--k82, rgba(255,255,255,0.4));border:1px solid var(--k36, rgba(0,0,0,0.12));text-align:center;cursor:pointer;overflow-x:auto}
.pt-ed .md-mermaid svg{max-width:100%;height:auto}.pt-ed .md-mermaid pre{text-align:left;margin:0}.pt-ed .md-mermaid.md-src-editing{cursor:default}
.md-src-err{color:#CF222E;font-size:12.5px;font-family:'IBM Plex Mono',monospace;white-space:pre-wrap;text-align:left;margin-top:6px}
.pt-ed nav.md-toc{margin:0 0 20px;padding:12px 18px;border-radius:12px;background:var(--k82, rgba(255,255,255,0.4));border:1px solid var(--k36, rgba(0,0,0,0.12));font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;font-size:14px}
.pt-ed nav.md-toc ul{list-style:none;margin:0;padding:0}.pt-ed nav.md-toc li{margin:4px 0}.pt-ed nav.md-toc a{color:var(--k9, #3A3A3C);text-decoration:none;cursor:pointer}.pt-ed nav.md-toc a:hover{text-decoration:underline}
.pt-ed img{max-width:100%;border-radius:10px}
.pt-ed:empty:before{content:attr(data-empty-hint);color:var(--k63, #C7C7CC)}
.pt-src::placeholder{color:var(--k63, #C7C7CC)}
</style>
</helmet>
<div data-edroot="1" data-format-open="{{ formatAttr }}" style="height:100%;display:flex;flex-direction:column;min-height:0;background:transparent;position:relative;font-family:var(--font-ui, -apple-system,'PingFang SC','Segoe UI','Microsoft YaHei UI',system-ui,sans-serif);color:var(--ink, #1D1D1F)">
  <sc-if value="{{ showBar }}" hint-placeholder-val="{{ true }}">
    <div data-editor-bar="1" style="position:absolute;top:10px;left:{{ barL }};right:{{ barR }};z-index:40;display:flex;justify-content:{{ barJ }};pointer-events:none">
      <div data-glass-bar="1" style="pointer-events:auto;max-width:100%;min-width:0;flex:0 1 auto;display:flex;align-items:center;gap:1px;padding:5px 6px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95))"><div style="width:{{ spW }};flex:none;display:{{ spD }};align-items:center;justify-content:flex-end;align-self:stretch"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin-right:5px"></span></div>
        <div style="display:flex;align-items:center;gap:1px;min-width:0;overflow-x:auto;scrollbar-width:none">
          <button onMouseDown="{{ md }}" onClick="{{ fileMenu }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--ink-2, rgba(29,29,31,0.62));background:transparent;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.94)">文件</button>
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
            <button onMouseDown="{{ md }}" onClick="{{ t.onClick }}" data-on="{{ t.active }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);font-size:12.5px;font-weight:{{ t.fw }};cursor:pointer;white-space:nowrap;color:{{ t.fg }};background:{{ t.bg }};transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.94)">{{ t.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex;align-items:center;flex:none">
          <span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span>
          <button onMouseDown="{{ md }}" onClick="{{ aiClick }}" data-ai-btn="1" title="AI 助手" style="height:28px;padding:0 10px 0 8px;border:none;border-radius:var(--ctl-r, 8px);background:{{ aiBg }};cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:{{ aiFg }};white-space:nowrap;flex:none;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.95)"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.8c.4 2.9 1.5 4 4.4 4.4-2.9.4-4 1.5-4.4 4.4-.4-2.9-1.5-4-4.4-4.4 2.9-.4 4-1.5 4.4-4.4z"></path><path d="M12.6 10.6c.2 1.2.6 1.6 1.8 1.8-1.2.2-1.6.6-1.8 1.8-.2-1.2-.6-1.6-1.8-1.8 1.2-.2 1.6-.6 1.8-1.8z"></path></svg>AI</button>
          <button onMouseDown="{{ md }}" onClick="{{ playClick }}" title="沉浸书写 Ctrl+." style="width:28px;height:28px;padding:0;flex:none;border:none;border-radius:var(--ctl-r, 8px);background:transparent;color:var(--ink-2, rgba(29,29,31,0.62));cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.9)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.25"></circle><path d="M6.6 5.6v4.8L10.6 8z" fill="currentColor" stroke="none"></path></svg></button>
        </div>
      </div>
    </div>
    <sc-if value="{{ bubbleOpen }}" hint-placeholder-val="{{ false }}">
      <div data-editor-tools="1" style="position:absolute;top:58px;left:{{ rbx }};z-index:39;width:0;height:0;overflow:visible"><div data-bubble="1" data-pop="{{ tabKey }}" style="position:absolute;left:0;top:0;translate:-50% 0;z-index:39;flex:none;width:max-content;max-width:{{ bMax }};transform-origin:top center;padding:5px 6px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px">
        <sc-for list="{{ tools }}" as="it" hint-placeholder-count="0">
          <sc-if value="{{ it.isSep }}" hint-placeholder-val="{{ false }}"><span data-editor-sep="1" style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span></sc-if>
          <sc-if value="{{ it.isBtn }}" hint-placeholder-val="{{ true }}">
            <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:28px;min-width:28px;padding:0 9px;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:13px;font-weight:{{ it.fw }};font-style:{{ it.fs }};text-decoration:{{ it.td }};font-family:{{ it.font }};cursor:pointer;white-space:nowrap;flex:none;color:var(--ink, #1D1D1F);transition:background .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07))" style-active="transform:scale(0.92)">{{ it.label }}</button>
          </sc-if>
        </sc-for>
      </div></div>
    </sc-if>
  </sc-if>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:{{ cols }};padding-top:{{ gridPT }};transition:grid-template-columns .55s cubic-bezier(.2,1,.3,1)">
    <sc-if value="{{ showOutline }}" hint-placeholder-val="{{ false }}">
      <div data-thumbpanel="1" data-pop="left" style="position:absolute;top:10px;left:10px;bottom:10px;width:204px;z-index:45;display:flex;flex-direction:column;min-height:0;border-radius:var(--panel-r, 16px);overflow:hidden;background:var(--panel-bg, linear-gradient(180deg,rgba(255,255,255,0.84),rgba(255,255,255,0.7)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--panel-bd, rgba(0,0,0,0.06));box-shadow:var(--panel-sh, 0 16px 40px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.95))"><div style="height:46px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 10px 0 18px"><button onClick="{{ closeThumbs }}" title="关闭" style="width:26px;height:26px;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:11px;color:var(--ink-3, rgba(29,29,31,0.36));cursor:pointer;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink-2, rgba(29,29,31,0.62))" style-active="transform:scale(0.88)">✕</button></div><div style="flex:1;min-height:0;overflow:auto;padding:2px 10px 14px;display:flex;flex-direction:column;gap:2px">
        
        <sc-for list="{{ outline }}" as="h" hint-placeholder-count="4">
          <div onClick="{{ h.onClick }}" style="flex:none;padding:6px 10px;padding-left:{{ h.indent }};border-radius:var(--ctl-r, 8px);font-size:12.5px;cursor:pointer;color:var(--ink-2, rgba(29,29,31,0.62));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:{{ h.fw }};transition:background .2s,color .2s" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)">{{ h.text }}</div>
        </sc-for>
        <sc-if value="{{ noOutline }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:var(--ink-3, rgba(29,29,31,0.36));padding:0 8px;line-height:1.6">标题会显示在这里。</div></sc-if>
      </div></div>
    </sc-if>
    <div ref="{{ scRef }}" onMouseDown="{{ onScDown }}" onScroll="{{ onScroll }}" style="grid-column:2;min-width:0;min-height:0;overflow:auto;position:relative">
      <div ref="{{ edRef }}" class="{{ edCls }}" data-empty-hint="{{ emptyHint }}" contentEditable="true" suppressContentEditableWarning="{{ true }}" spellCheck="false" onInput="{{ onRichInput }}" onKeyDown="{{ onRichKey }}" onClick="{{ onRichClick }}" onPaste="{{ onRichPaste }}" onDrop="{{ onDropImg }}" onMouseDown="{{ onColDown }}" onMouseMove="{{ onColMove }}" style="display:{{ richDisp }};max-width:720px;margin:0 auto;padding:{{ pad }};min-height:100%;box-sizing:border-box"></div>
      <sc-if value="{{ isSrc }}" hint-placeholder-val="{{ false }}">
        <textarea ref="{{ taRef }}" class="pt-src" data-pop="center" value="{{ text }}" onChange="{{ onText }}" onKeyDown="{{ onSrcKey }}" onPaste="{{ onSrcPaste }}" onDrop="{{ onDropImg }}" onSelect="{{ onSelect }}" spellCheck="false" placeholder="# 标题" style="display:block;width:100%;max-width:760px;margin:0 auto;min-height:100%;border:none;outline:none;resize:none;background:transparent;padding:{{ pad }};box-sizing:border-box;font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:14.5px;line-height:1.85;color:var(--k9, #3A3A3C);tab-size:2;field-sizing:content"></textarea>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ pure }}" hint-placeholder-val="{{ false }}"><div data-pure-status="1" data-theme-keep style="position:absolute;right:52px;bottom:12px;z-index:30;font-size:11px;line-height:14px;color:var(--pr-ink, rgba(0,0,0,0.34));white-space:nowrap;pointer-events:none;transition:opacity .18s ease-out"><span>{{ statWords }}</span><span> · </span><span>约 {{ statMin }} 分钟读完</span></div></sc-if>
  <sc-if value="{{ notPure }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;right:52px;bottom:12px;z-index:30;display:flex;align-items:center;gap:12px;font-size:11px;line-height:14px;color:var(--ink-3, rgba(29,29,31,0.36));white-space:nowrap;pointer-events:none">
      <span>纯文本</span><span>{{ statWords }}</span><span>{{ statChars }}</span><span>约 {{ statMin }} 分钟读完</span>
    </div>
  </sc-if>
  <button onMouseDown="{{ md }}" onClick="{{ toggleMode }}" title="{{ modeTitle }}" style="position:absolute;right:12px;bottom:7px;z-index:31;min-width:28px;height:24px;padding:0 6px;border:none;border-radius:var(--ctl-r, 8px);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:{{ modeFs }};font-weight:600;font-family:{{ modeFont }};color:var(--ink-3, rgba(29,29,31,0.36));transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.9)"><span data-pop="center" data-k="{{ modeIcon }}">{{ modeIcon }}</span></button>

  <sc-if value="{{ hasSelBar }}" hint-placeholder-val="{{ false }}">
    <div data-menu="1" data-pop="menu" onMouseDown="{{ md }}" style="position:fixed;left:{{ sbx }};top:{{ sby }};z-index:80;display:flex;align-items:center;gap:1px;padding:4px;margin-left:{{ sbML }};border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95))">

      selBtns: pure ? pureSel : [SB('B', 'bold', { fw: 700 }), SB('I', 'italic', { fs: 'italic', font: "'Noto Serif SC',serif" }), SB('S', 'strike', { td: 'line-through' }), SB('</>', 'code', { font: "'IBM Plex Mono',monospace", title: $t('行内代码') }), SB($t('高亮'), 'mark'), SB($t('链接'), 'link'), SB('H1', 'h1', { fw: 600 }), SB('H2', 'h2', { fw: 600 }), SB($t('引用'), 'quote')],
      onImg: e => { const f = e.target.files[0]; e.target.value = ''; if (f) this.addImage(f); },
      onSrcPaste: e => { const f = this.imageIn(e.clipboardData); if (f) { e.preventDefault(); this.addImage(f); } },
      onDropImg: e => { const f = this.imageIn(e.dataTransfer); if (f) { e.preventDefault(); e.stopPropagation(); this.addImage(f); } }, // a picture dropped on the text goes into the document, not to the shell as a file to open
      statWords: $t('{n} 字', { n: stats.words }), statChars: $t('{n} 字符', { n: stats.chars || 0 }), statMin: stats.minutes
    };
  }
}
</script>
