<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./i18n.js"></script><script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./theme-dark.css">
<style>
.mm-canvas svg text{font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;pointer-events:none;user-select:none}
.mm-canvas [data-act]{cursor:pointer}
.mm-canvas [data-act]:hover .mm-btn{fill:var(--k7, #1D1D1F)}
.mm-canvas [data-act]:hover .mm-plus{stroke:var(--kinv, #FFFFFF)}
.mm-edit{position:absolute;box-sizing:border-box;border:2px solid var(--k7, #1D1D1F);background:var(--k0, #FFFFFF);color:var(--k1, #1D1D1F);outline:none;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;box-shadow:0 8px 24px var(--k77, rgba(0,0,0,0.14));z-index:5}
.mm-note::placeholder{color:var(--k63, #C7C7CC)}
.mm-outline{font-family:'IBM Plex Sans','Noto Sans SC',sans-serif}
.mm-range{-webkit-appearance:none;appearance:none;width:60px;height:3px;border-radius:2px;background:var(--line, rgba(0,0,0,0.1));outline:none;cursor:pointer}
.mm-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:9px;height:9px;border-radius:50%;background:var(--ink-2, rgba(29,29,31,0.62));border:none}
</style>
</helmet>
<div ref="{{ rootRef }}" data-edroot="1" tabIndex="-1" onKeyDown="{{ onKey }}" style="height:100%;display:flex;flex-direction:column;min-height:0;background:transparent;position:relative;box-sizing:border-box;padding-right:{{ panelPad }};transition:padding-right .28s cubic-bezier(.2,.8,.2,1);outline:none;font-family:var(--font-ui, -apple-system,'PingFang SC','Segoe UI','Microsoft YaHei UI',system-ui,sans-serif);color:var(--ink, #1D1D1F)">
  <sc-if value="{{ showBar }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;top:10px;left:{{ barL }};right:{{ barR }};z-index:40;display:flex;justify-content:{{ barJ }};pointer-events:none">
      <div data-glass-bar="1" style="pointer-events:auto;max-width:100%;min-width:0;flex:0 1 auto;display:flex;align-items:center;gap:1px;padding:5px 6px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95))"><div style="width:{{ spW }};flex:none;display:{{ spD }};align-items:center;justify-content:flex-end;align-self:stretch"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin-right:5px"></span></div>
        <div style="display:flex;align-items:center;gap:1px;min-width:0;overflow-x:auto;scrollbar-width:none">
          <button onMouseDown="{{ md }}" onClick="{{ fileMenu }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--ink-2, rgba(29,29,31,0.62));background:transparent;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.94)">文件</button>
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
            <button onMouseDown="{{ md }}" onClick="{{ t.onClick }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);font-size:12.5px;font-weight:{{ t.fw }};cursor:pointer;white-space:nowrap;color:{{ t.fg }};background:{{ t.bg }};transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.94)">{{ t.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex;align-items:center;flex:none">
          <span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span>
          <button onMouseDown="{{ md }}" onClick="{{ aiClick }}" data-ai-btn="1" title="AI 助手" style="height:28px;padding:0 10px 0 8px;border:none;border-radius:var(--ctl-r, 8px);background:{{ aiBg }};cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:{{ aiFg }};white-space:nowrap;flex:none;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.95)"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.8c.4 2.9 1.5 4 4.4 4.4-2.9.4-4 1.5-4.4 4.4-.4-2.9-1.5-4-4.4-4.4 2.9-.4 4-1.5 4.4-4.4z"></path><path d="M12.6 10.6c.2 1.2.6 1.6 1.8 1.8-1.2.2-1.6.6-1.8 1.8-.2-1.2-.6-1.6-1.8-1.8 1.2-.2 1.6-.6 1.8-1.8z"></path></svg>AI</button>
          <button onMouseDown="{{ md }}" onClick="{{ playClick }}" title="纯净模式 Ctrl+." style="width:28px;height:28px;padding:0;flex:none;border:none;border-radius:var(--ctl-r, 8px);background:transparent;color:var(--ink-2, rgba(29,29,31,0.62));cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.9)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.25"></circle><path d="M6.6 5.6v4.8L10.6 8z" fill="currentColor" stroke="none"></path></svg></button>
        </div>
      </div>
    </div>
    <sc-if value="{{ bubbleOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:58px;left:{{ rbx }};z-index:39;width:0;height:0;overflow:visible"><div data-bubble="1" data-pop="{{ tabKey }}" style="position:absolute;left:0;top:0;translate:-50% 0;z-index:39;flex:none;width:max-content;max-width:{{ bMax }};transform-origin:top center;padding:5px 6px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px">
        <sc-for list="{{ tools }}" as="it" hint-placeholder-count="0">
          <sc-if value="{{ it.isSep }}" hint-placeholder-val="{{ false }}"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span></sc-if>
          <sc-if value="{{ it.isLbl }}" hint-placeholder-val="{{ false }}"><span style="font-size:11.5px;color:var(--ink-3, rgba(29,29,31,0.36));padding:0 5px 0 4px;flex:none">{{ it.label }}</span></sc-if>
          <sc-if value="{{ it.isBtn }}" hint-placeholder-val="{{ true }}">
            <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:28px;min-width:28px;padding:0 9px;border:none;border-radius:var(--ctl-r, 8px);background:{{ it.bg }};font-size:{{ it.fs }};font-weight:{{ it.fw }};font-style:{{ it.fst }};text-decoration:{{ it.td }};color:{{ it.color }};cursor:pointer;white-space:nowrap;flex:none;transition:background .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07))" style-active="transform:scale(0.92)">{{ it.label }}</button>
          </sc-if>
          <sc-if value="{{ it.isSw }}" hint-placeholder-val="{{ false }}">
            <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="width:28px;height:28px;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:{{ it.bg }};cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07))" style-active="transform:scale(0.9)"><span style="width:16px;height:16px;border-radius:5px;background:{{ it.sw }};box-shadow:inset 0 0 0 1px var(--k60, rgba(0,0,0,0.14))"></span></button>
          </sc-if>
        </sc-for>
      </div></div>
    </sc-if>
  </sc-if>
  <sc-if value="{{ formatOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="FormatPanel" tabs="{{ panelTabs }}" groups="{{ panelGroups }}" tab="{{ tabKey }}" style="position:absolute;right:8px;top:6px;bottom:8px;width:304px;z-index:44" hint-size="304px,100%"></dc-import>
  </sc-if>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:{{ cols }};transition:grid-template-columns .55s cubic-bezier(.2,1,.3,1)">
    <sc-if value="{{ showOutline }}" hint-placeholder-val="{{ false }}">
      <div data-thumbpanel="1" data-pop="left" style="position:absolute;top:10px;left:10px;bottom:10px;width:204px;z-index:45;display:flex;flex-direction:column;min-height:0;border-radius:var(--panel-r, 16px);overflow:hidden;background:var(--panel-bg, linear-gradient(180deg,rgba(255,255,255,0.84),rgba(255,255,255,0.7)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--panel-bd, rgba(0,0,0,0.06));box-shadow:var(--panel-sh, 0 16px 40px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.95))"><div style="height:46px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 10px 0 18px"><button onClick="{{ closeThumbs }}" title="关闭" style="width:26px;height:26px;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:11px;color:var(--ink-3, rgba(29,29,31,0.36));cursor:pointer;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink-2, rgba(29,29,31,0.62))" style-active="transform:scale(0.88)">✕</button></div><div style="flex:1;min-height:0;overflow:auto;padding:2px 10px 14px;display:flex;flex-direction:column;gap:1px">
        <sc-for list="{{ outline }}" as="h" hint-placeholder-count="6">
          <div onClick="{{ h.onClick }}" title="{{ h.text }}" style="flex:none;padding:6px 10px;padding-left:{{ h.indent }};border-radius:var(--ctl-r, 8px);font-size:12.5px;cursor:pointer;color:var(--ink-2, rgba(29,29,31,0.62));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:{{ h.fw }};background:{{ h.bg }};transition:background .2s,color .2s" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)"><span style="color:var(--ink-3, rgba(29,29,31,0.36));font-size:10px;margin-right:4px">{{ h.mark }}</span>{{ h.text }}</div>
        </sc-for>
      </div></div>
    </sc-if>
    <div ref="{{ canvasRef }}" class="mm-canvas" onMouseDown="{{ onCanvasDown }}" onMouseMove="{{ onCanvasMove }}" onMouseLeave="{{ onCanvasLeave }}" onDoubleClick="{{ onCanvasDbl }}" onContextMenu="{{ onCanvasCtx }}" style="grid-column:2;min-width:0;min-height:0;overflow:hidden;position:relative;cursor:{{ cursor }};user-select:none;-webkit-user-select:none">
      <svg style="position:absolute;inset:0;width:100%;height:100%;display:{{ svgDisp }};overflow:visible">
        <g style="transform:{{ tf }};transition:{{ tfTr }}">
          <g dangerouslySetInnerHTML="{{ svgUnder }}"></g>
          <g dangerouslySetInnerHTML="{{ svgMap }}"></g>
          <g dangerouslySetInnerHTML="{{ svgOver }}"></g>
        </g>
      </svg>
      <textarea ref="{{ taRef }}" class="mm-edit" value="{{ taVal }}" onChange="{{ onEditText }}" onKeyDown="{{ onKey }}" onBlur="{{ onEditBlur }}" onCompositionStart="{{ onCompStart }}" onCompositionEnd="{{ onCompEnd }}" onCopy="{{ onCopy }}" onCut="{{ onCut }}" onPaste="{{ onPaste }}" onMouseDown="{{ stop }}" spellCheck="false" autoComplete="off" style="left:{{ edL }};top:{{ edT }};width:{{ edW }};height:{{ edH }};padding:{{ edPad }};border-radius:{{ edRx }};font-size:{{ edFs }};line-height:{{ edLh }};font-weight:{{ edFw }};font-style:{{ edFi }};font-family:{{ edFam }};text-decoration:{{ edTd }};opacity:{{ edOp }};pointer-events:{{ edPe }};caret-color:{{ edCaret }}"></textarea>
      <sc-if value="{{ hasMarquee }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:{{ mqL }};top:{{ mqT }};width:{{ mqW }};height:{{ mqH }};pointer-events:none;z-index:6;border-radius:6px;border:1px solid var(--k13, rgba(0,0,0,0.28));background:var(--k55, rgba(0,0,0,0.06))"></div>
      </sc-if>
      <sc-if value="{{ hasSearch }}" hint-placeholder-val="{{ false }}">
        <div onMouseDown="{{ stop }}" style="position:absolute;top:12px;right:16px;z-index:27;display:flex;align-items:center;gap:6px;height:34px;padding:0 5px 0 12px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95))">
          <input ref="{{ searchRef }}" class="mm-note" value="{{ searchQ }}" onChange="{{ onSearch }}" onKeyDown="{{ onSearchKey }}" placeholder="搜索主题" spellCheck="false" autoComplete="off" style="width:180px;border:none;background:transparent;font-size:13px;outline:none;color:var(--ink, #1D1D1F)">
          <span style="font-size:11.5px;color:var(--ink-3, rgba(29,29,31,0.36));min-width:36px;text-align:right;font-variant-numeric:tabular-nums">{{ searchStat }}</span>
          <button onClick="{{ closeSearch }}" title="关闭" style="width:24px;height:24px;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:11px;color:var(--ink-3, rgba(29,29,31,0.36));cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink-2, rgba(29,29,31,0.62))">✕</button>
        </div>
      </sc-if>
      <sc-if value="{{ isOutline }}" hint-placeholder-val="{{ false }}">
        <textarea ref="{{ outRef }}" class="mm-outline" value="{{ outlineText }}" onChange="{{ onOutlineText }}" onKeyDown="{{ onOutlineKey }}" onBlur="{{ onOutlineBlur }}" onMouseDown="{{ stop }}" spellCheck="false" style="position:absolute;inset:0;z-index:24;border:none;resize:none;outline:none;background:transparent;padding:72px 48px 48px;font-size:14.5px;line-height:1.9;tab-size:4;color:var(--k1, #1D1D1F);white-space:pre;overflow:auto"></textarea>
      </sc-if>
      <sc-if value="{{ hasGhost }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:{{ gx }};top:{{ gy }};pointer-events:none;z-index:20;max-width:240px;padding:7px 12px;border-radius:12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink, #1D1D1F);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95))">{{ ghostText }}</div>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ pure }}" hint-placeholder-val="{{ false }}"><div data-pure-status="1" data-theme-keep style="position:absolute;right:14px;bottom:12px;z-index:30;font-size:11px;line-height:14px;color:var(--pr-ink, rgba(0,0,0,0.34));white-space:nowrap;pointer-events:none;transition:opacity .18s ease-out">{{ statCount }}</div></sc-if>
  <sc-if value="{{ notPure }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;right:calc(18px + {{ panelPad }});transition:right .28s cubic-bezier(.2,.8,.2,1);bottom:12px;z-index:30;display:flex;align-items:center;gap:8px;font-size:11px;line-height:14px;color:var(--ink-3, rgba(29,29,31,0.36));white-space:nowrap">
      <span>{{ statCount }}</span>
      <button onClick="{{ zoomOut }}" title="缩小 Ctrl+−" style="width:18px;height:18px;padding:0;border:none;border-radius:5px;background:transparent;font-size:13px;line-height:1;cursor:pointer;color:inherit;transition:color .2s" style-hover="color:var(--ink, #1D1D1F)">−</button>
      <input class="mm-range" type="range" min="20" max="400" step="1" value="{{ zPct }}" onChange="{{ onZoomSlide }}" title="缩放">
      <button onClick="{{ zoomIn }}" title="放大 Ctrl+=" style="width:18px;height:18px;padding:0;border:none;border-radius:5px;background:transparent;font-size:13px;line-height:1;cursor:pointer;color:inherit;transition:color .2s" style-hover="color:var(--ink, #1D1D1F)">+</button>
      <span style="min-width:30px;text-align:right;font-variant-numeric:tabular-nums">{{ zPctText }}</span>
      <button onClick="{{ fitClick }}" title="适应画布" style="height:18px;padding:0 4px;border:none;border-radius:5px;background:transparent;font-size:11px;cursor:pointer;color:inherit;transition:color .2s" style-hover="color:var(--ink, #1D1D1F)">适应画布</button>
    </div>
  </sc-if>
  <sc-if value="{{ hasPop }}" hint-placeholder-val="{{ false }}">
    <div data-pop="topic" onMouseDown="{{ stop }}" style="position:absolute;left:{{ popL }};top:{{ popT }};z-index:31;width:264px;display:flex;flex-direction:column;overflow:hidden;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95))">
      <div style="height:32px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 13px;font-size:12px;color:var(--ink-2, rgba(29,29,31,0.62));white-space:nowrap"><span style="flex:none">{{ popTitle }}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink, #1D1D1F);font-weight:500">{{ popTopic }}</span><button onClick="{{ closePop }}" title="关闭" style="width:24px;height:24px;flex:none;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:11px;color:var(--ink-3, rgba(29,29,31,0.36));cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink-2, rgba(29,29,31,0.62))">✕</button></div>
      <sc-if value="{{ popIsNote }}" hint-placeholder-val="{{ true }}">
        <textarea ref="{{ popRef }}" class="mm-note" value="{{ popVal }}" onChange="{{ onPopText }}" onFocus="{{ onNoteFocus }}" onKeyDown="{{ onPopKey }}" placeholder="给这个主题写点备注…" spellCheck="false" style="height:104px;border:none;background:transparent;resize:none;padding:2px 13px 12px;font-size:12.5px;line-height:1.6;outline:none;color:var(--ink, #1D1D1F)"></textarea>
      </sc-if>
      <sc-if value="{{ popIsLine }}" hint-placeholder-val="{{ false }}">
        <input ref="{{ popRef }}" class="mm-note" value="{{ popVal }}" onChange="{{ onPopText }}" onKeyDown="{{ onPopKey }}" onBlur="{{ onPopBlur }}" placeholder="{{ popHint }}" spellCheck="false" autoComplete="off" style="height:34px;border:none;background:transparent;padding:0 13px 8px;font-size:13px;outline:none;color:var(--ink, #1D1D1F)">
      </sc-if>
    </div>
  </sc-if>
  <input ref="{{ imgRef }}" type="file" accept="image/*" onChange="{{ onImgFile }}" style="display:none">
  <sc-if value="{{ hasMenu }}" hint-placeholder-val="{{ false }}">
    <div onMouseDown="{{ closeMenu }}" onContextMenu="{{ closeMenuCtx }}" style="position:fixed;inset:0;z-index:90"></div>
    <div data-menu="1" data-pop="menu" onMouseDown="{{ md }}" style="position:fixed;left:{{ menuX }};top:{{ menuY }};z-index:91;min-width:200px;max-height:460px;overflow:auto;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));padding:6px;display:flex;flex-direction:column">
      <sc-for list="{{ menuItems }}" as="mi" hint-placeholder-count="0">
