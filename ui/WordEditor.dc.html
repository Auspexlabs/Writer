<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./theme-dark.css">
<style>
.wd-ed{outline:none;word-break:break-word}
.wd-ed h1{font-size:26px;font-weight:700;margin:18px 0 8px;line-height:1.4}
.wd-ed h2{font-size:20px;font-weight:600;margin:16px 0 6px;line-height:1.45}
.wd-ed h3{font-size:16px;font-weight:600;margin:14px 0 4px}
.wd-ed p{margin:0 0 8px}
.wd-ed blockquote{margin:8px 0;padding:4px 14px;border-left:3px solid var(--k10, #D1D1D6);color:var(--k11, #6E6E73)}
.wd-ed pre{font-family:'IBM Plex Mono',monospace;background:var(--k48, #F5F5F7);padding:10px 12px;font-size:13px;white-space:pre-wrap;border-radius:4px}
.wd-ed ul,.wd-ed ol{margin:0 0 8px;padding-left:1.6em}
.wd-ed img{max-width:100%;cursor:pointer}
.wd-ed figure[data-pic] img{max-width:none}
.wd-ed .wd-busy{opacity:.5;transition:opacity .2s}
.wd-ed a{color:var(--k2, #2F5D8A)}
.wd-ed ins[data-t]{color:var(--k61, #2E7350);text-decoration:underline;text-decoration-color:var(--k61, #2E7350)}
.wd-ed del[data-t]{color:var(--k62, #B5563A);text-decoration:line-through}
.wd-ed [data-cid]{background:#F3E6C4;border-bottom:2px solid #E3B25A;color:#1D1D1F} /* theme: keep — dark text on the light mark in both themes */
.wd-ed [data-ink="dark"]{color:#1D1D1F}.wd-ed [data-ink="light"]{color:#FFFFFF} /* theme: keep — automatic text on a fill of its own takes Word's colour for that fill (engine.js inkFills), not the theme's */
.wd-ed hr[data-pb],.wd-ed span[data-pb]{border:none;border-top:1px dashed var(--k47, #C7C7CC);margin:28px -20px;position:relative}
.wd-ed span[data-pb]{display:block}
.wd-ed [data-pb="before"]::before{content:'';display:block;border-top:1px dashed var(--k47, #C7C7CC);margin:28px -20px}
.wd-ed [data-pb="before"]:first-child::before,.wd-ed hr[data-pb]+[data-pb="before"]::before{display:none}
.wd-ed hr{border:none;border-top:1px solid var(--k10, #D1D1D6);margin:16px 0}
.wd-ed td,.wd-ed th{vertical-align:top}
[data-thumbpanel] div:has(> div > div > .wd-ed){content-visibility:auto}
.wd-ed [data-toc] a{color:inherit;text-decoration:none}
.wd-ed [data-toc] > div{cursor:pointer}
.wd-hf{font-family:'Noto Serif SC',serif;font-size:9pt;line-height:1.5;word-break:break-word}
.wd-hf p{margin:0}
.wd-hf img{vertical-align:middle;max-width:100%}
.wd-fld{background:var(--k12, #F2F2F7);box-shadow:inset 0 0 0 1px var(--k6, #E5E5EA);border-radius:3px;padding:0 3px}
</style>
</helmet>
<div data-edroot="1" tabIndex="-1" onKeyDown="{{ onRootKey }}" style="height:100%;display:flex;flex-direction:column;min-height:0;background:{{ rootBg }};position:relative;outline:none">
  <sc-if value="{{ notPure }}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;top:10px;left:{{ barL }};right:{{ barR }};z-index:40;display:flex;justify-content:{{ barJ }};pointer-events:none"><div data-glass-bar="1" style="pointer-events:auto;max-width:100%;min-width:0;flex:0 1 auto;display:flex;align-items:center;gap:1px;padding:4px;border-radius:999px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1))"><div style="width:{{ spW }};flex:none;display:{{ spD }};align-items:center;justify-content:flex-end;align-self:stretch"><span style="width:1px;height:18px;background:var(--k36, rgba(0,0,0,0.12));margin-right:4px"></span></div>
    <div style="display:flex;align-items:center;gap:1px;min-width:0;overflow-x:auto;scrollbar-width:none">
    <button onMouseDown="{{ md }}" onClick="{{ fileMenu }}" style="height:34px;padding:0 13px;border:none;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--k1, #1D1D1F);transition:background .25s ease,box-shadow .25s ease,transform .35s cubic-bezier(.2,1.4,.4,1);background:transparent" style-hover="background:var(--k30, rgba(255,255,255,0.6))" style-active="transform:scale(0.94)">文件</button>
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <button onMouseDown="{{ md }}" onClick="{{ t.onClick }}" style="height:34px;padding:0 13px;border:none;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--k1, #1D1D1F);transition:background .25s ease,box-shadow .25s ease,transform .35s cubic-bezier(.2,1.4,.4,1);background:{{ t.bg }};box-shadow:{{ t.line }};font-weight:{{ t.weight }}" style-hover="background:var(--k30, rgba(255,255,255,0.6))" style-active="transform:scale(0.94)">{{ t.label }}</button>
    </sc-for>
    </div><div style="display:flex;align-items:center;flex:none"><span style="width:1px;height:18px;background:var(--k60, rgba(0,0,0,0.14));margin:0 4px;flex:none"></span><button onMouseDown="{{ md }}" onClick="{{ aiClick }}" title="AI 助手" style="height:34px;padding:0 13px 0 11px;border:none;border-radius:999px;background:{{ aiBg }};box-shadow:{{ aiSh }};cursor:pointer;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--k1, #1D1D1F);white-space:nowrap;flex:none;transition:background .25s,box-shadow .25s,transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--k20, rgba(255,255,255,0.7))" style-active="transform:scale(0.95)"><span style="font-size:13px;line-height:1">✦</span>AI</button><button onMouseDown="{{ md }}" onClick="{{ playClick }}" title="沉浸书写 Ctrl+." style="width:40px;height:34px;flex:none;border:none;border-radius:999px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--k20, rgba(255,255,255,0.7))" style-active="transform:scale(0.9)"><span style="width:19px;height:19px;border:1.7px solid var(--k7, #1D1D1F);border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><span style="width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6.5px solid var(--k7, #1D1D1F);margin-left:1.5px"></span></span></button></div>
  </div></div>
  <sc-if value="{{ bubbleOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:58px;left:{{ rbx }};z-index:39;width:0;height:0;overflow:visible"><div data-bubble="1" data-pop="{{ tabKey }}" style="position:absolute;left:0;top:0;translate:-50% 0;z-index:39;flex:none;width:max-content;max-width:{{ bMax }};transform-origin:top center;padding:8px 10px;border-radius:22px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;transform-origin:top left">
      <sc-for list="{{ ribbon }}" as="it" hint-placeholder-count="12">
        <sc-if value="{{ it.isSep }}" hint-placeholder-val="{{ false }}"><span style="width:1px;height:20px;background:var(--k36, rgba(0,0,0,0.12));margin:0 6px;flex:none"></span></sc-if>
        <sc-if value="{{ it.isBtn }}" hint-placeholder-val="{{ true }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:30px;min-width:30px;padding:0 8px;border:none;border-radius:6px;background:{{ it.bg }};font-size:13px;font-weight:{{ it.fw }};font-style:{{ it.fs }};text-decoration:{{ it.td }};font-family:{{ it.font }};color:{{ it.color }};cursor:pointer;white-space:nowrap;flex:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">{{ it.label }}</button>
        </sc-if>
        <sc-if value="{{ it.isAlign }}" hint-placeholder-val="{{ false }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:30px;width:30px;border:none;border-radius:6px;background:{{ it.bg }};cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:{{ it.ai }};gap:2.5px;padding:0 8px;flex:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">
            <span style="height:1.6px;width:{{ it.b1 }};background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:{{ it.b2 }};background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:{{ it.b3 }};background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:{{ it.b4 }};background:var(--k7, #1D1D1F)"></span>
          </button>
        </sc-if>
        <sc-if value="{{ it.isSel }}" hint-placeholder-val="{{ false }}">
          <select data-val="{{ it.value }}" title="{{ it.title }}" value="{{ it.value }}" onChange="{{ it.onChange }}" style="height:28px;padding:0 4px;border:1px solid var(--k17, rgba(0,0,0,0.07));border-radius:9px;background:var(--k30, rgba(255,255,255,0.6));font-size:12.5px;width:{{ it.w }};flex:none;margin:0 2px">
            <sc-for list="{{ it.options }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}">{{ o.l }}</option></sc-for>
          </select>
        </sc-if>
        <sc-if value="{{ it.isColor }}" hint-placeholder-val="{{ false }}">
          <label title="{{ it.title }}" onMouseDown="{{ it.onPre }}" style="position:relative;height:30px;min-width:32px;padding:0 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;flex:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">
            <span style="font-size:13px;line-height:1.1;font-weight:{{ it.fw }}">{{ it.label }}</span>
            <span style="width:18px;height:3.5px;border-radius:1px;background:{{ it.swatch }};margin-top:2px;box-shadow:inset 0 0 0 0.5px var(--k45, rgba(0,0,0,0.2))"></span>
            <input type="color" value="{{ it.value }}" onChange="{{ it.onChange }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0">
          </label>
        </sc-if>
        <sc-if value="{{ it.isMenu }}" hint-placeholder-val="{{ false }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onToggle }}" style="height:30px;padding:0 8px;border:none;border-radius:6px;background:{{ it.bg }};font-size:13px;cursor:pointer;white-space:nowrap;flex:none;display:flex;align-items:center;gap:4px" style-hover="background:var(--k20, rgba(255,255,255,0.7))">{{ it.label }}<span style="font-size:9px;color:var(--k8, #8E8E93)">▼</span></button>
        </sc-if>
        <sc-if value="{{ it.isRange }}" hint-placeholder-val="{{ false }}">
          <label title="{{ it.title }}" style="height:30px;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:12.5px;color:var(--k11, #6E6E73);flex:none;white-space:nowrap">{{ it.label }}<input type="range" min="{{ it.min }}" max="{{ it.max }}" step="1" value="{{ it.value }}" onChange="{{ it.onChange }}" style="width:84px;accent-color:var(--k1, #1D1D1F)"><span style="min-width:26px;text-align:right;font-variant-numeric:tabular-nums;color:var(--k1, #1D1D1F)">{{ it.text }}</span></label>
        </sc-if>
      </sc-for>
    </div></div>
  </sc-if>

  </sc-if>
  <sc-if value="{{ showFind }}" hint-placeholder-val="{{ false }}">
    <div data-pop="menu" data-glass-bar="1" style="position:absolute;top:58px;left:50%;margin-left:-330px;width:660px;z-index:38;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;border-radius:999px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1));font-size:13px">
      <input ref="{{ findRef }}" value="{{ fq }}" onChange="{{ onFq }}" onKeyDown="{{ onFindKey }}" placeholder="查找" style="height:30px;width:150px;padding:0 12px;border:1px solid var(--k17, rgba(0,0,0,0.07));border-radius:999px;background:var(--k20, rgba(255,255,255,0.7));font-size:13px;outline:none">
      <input value="{{ fr }}" onChange="{{ onFr }}" placeholder="替换为" style="height:30px;width:150px;padding:0 12px;border:1px solid var(--k17, rgba(0,0,0,0.07));border-radius:999px;background:var(--k20, rgba(255,255,255,0.7));font-size:13px;outline:none">
      <button onMouseDown="{{ md }}" onClick="{{ findNext }}" style="height:30px;padding:0 12px;border:none;border-radius:999px;background:var(--k42, rgba(255,255,255,0.55));font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--k50, rgba(255,255,255,0.9))">查找下一个</button>
      <button onMouseDown="{{ md }}" onClick="{{ replaceOne }}" style="height:30px;padding:0 12px;border:none;border-radius:999px;background:var(--k42, rgba(255,255,255,0.55));font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--k50, rgba(255,255,255,0.9))">替换</button>
      <button onMouseDown="{{ md }}" onClick="{{ replaceAll }}" style="height:30px;padding:0 12px;border:none;border-radius:999px;background:var(--k42, rgba(255,255,255,0.55));font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--k50, rgba(255,255,255,0.9))">全部替换</button>
      <span style="color:var(--k8, #8E8E93)">{{ fcountText }}</span>
      <div style="flex:1"></div>
      <button onClick="{{ closeFind }}" style="height:28px;padding:0 10px;border:none;border-radius:6px;background:transparent;font-size:12.5px;cursor:pointer;color:var(--k11, #6E6E73)">关闭</button>
    </div>
  </sc-if>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:{{ bodyCols }};transition:grid-template-columns .55s cubic-bezier(.2,1,.3,1)">
    <sc-if value="{{ showNav }}" hint-placeholder-val="{{ false }}">
      <div data-thumbpanel="1" data-pop="left" style="position:absolute;top:10px;left:10px;bottom:10px;width:204px;z-index:45;display:flex;flex-direction:column;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--k32, rgba(255,255,255,0.5)),var(--k33, rgba(255,255,255,0.32)));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k34, rgba(255,255,255,0.9)),0 14px 40px var(--k19, rgba(0,0,0,0.1))"><div style="height:46px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 10px 0 18px"><button onClick="{{ closeThumbs }}" title="关闭" style="width:26px;height:26px;border:none;border-radius:999px;background:transparent;font-size:11px;color:var(--k11, #6E6E73);cursor:pointer;transition:transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--k31, rgba(255,255,255,0.95))" style-active="transform:scale(0.88)">✕</button></div><div style="flex:1;min-height:0;overflow:auto;padding:2px 10px 14px;display:flex;flex-direction:column;gap:2px">
        
        <div style="flex:none;display:flex;flex-direction:column;gap:12px;align-items:center;padding-bottom:16px">
          <sc-for list="{{ pageThumbs }}" as="pt" hint-placeholder-count="1">
            <div onClick="{{ pt.onClick }}" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer" style-hover="transform:translateY(-1px)">
              <div data-light="1" style="width:{{ pt.w }};height:{{ pt.h }};background:{{ pageBg }};box-shadow:0 0 0 1px var(--kpageb, rgba(0,0,0,0.06)),0 4px 14px var(--k65, rgba(0,0,0,0.07));border-radius:6px;overflow:hidden;position:relative;outline:{{ pt.line }};outline-offset:3px;transition:transform .35s cubic-bezier(.2,1.4,.4,1)">
                <div style="position:absolute;left:0;right:0;top:{{ pt.top }};height:{{ pt.ch }};overflow:hidden">
                  <div style="position:absolute;left:0;top:0;width:{{ pt.pw }};transform:{{ pt.tf }};transform-origin:0 0;pointer-events:none">
                    <div class="wd-ed" dangerouslySetInnerHTML="{{ thumbHtml }}" style="padding:0 {{ pt.padH }};margin-top:{{ pt.off }};font-family:'Noto Serif SC',serif;font-size:11pt;line-height:1.8;column-count:{{ cols }};column-gap:32px;color:{{ pageInk }}"></div>
                  </div>
                </div>
              </div>
              <span style="font-size:11px;color:var(--k11, #6E6E73)">{{ pt.n }}</span>
            </div>
          </sc-for>
        </div>
        <div style="flex:none;font-size:12px;color:var(--k8, #8E8E93);padding:0 8px 8px">标题</div>
        <sc-for list="{{ heads }}" as="h" hint-placeholder-count="4">
          <div onClick="{{ h.onClick }}" style="flex:none;padding:7px 10px;padding-left:{{ h.indent }};border-radius:10px;font-size:13px;cursor:pointer;color:var(--k9, #3A3A3C);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:{{ h.fw }}" style-hover="background:#EFEFF4">{{ h.text }}</div>
        </sc-for>
        <sc-if value="{{ noHeads }}" hint-placeholder-val="{{ false }}"><div style="font-size:12.5px;color:var(--k8, #8E8E93);padding:0 8px;line-height:1.6">用「标题 1/2/3」样式的段落会显示在这里。</div></div></sc-if>
      </div>
    </sc-if>
    <div ref="{{ cvRef }}" data-light="{{ cvLight }}" onMouseDown="{{ onCanvasDown }}" style="grid-column:2;overflow:auto;padding:{{ cvPad }};min-width:0;background:{{ cvBg }}">
      <div style="zoom:{{ zoomV }};width:{{ pageW }};margin:0 auto">
        <div data-light="1" onMouseDown="{{ onSheetDown }}" onDoubleClick="{{ onSheetDbl }}" style="width:{{ pageW }};min-height:{{ sheetH }};background:{{ sheetBg }};padding:{{ pad }};position:relative;display:flex;flex-direction:column;color:{{ pageInk }}">
          <sc-for list="{{ sheets }}" as="s" hint-placeholder-count="1">
            <div style="position:absolute;left:0;right:0;top:{{ s.top }};height:{{ s.h }};background:{{ pageBg }};box-shadow:{{ pageSh }};pointer-events:none;overflow:hidden">
              <sc-if value="{{ hasWm }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span style="transform:rotate(-32deg);font-size:110px;font-weight:700;color:rgba(29,29,31,0.07);white-space:nowrap;font-family:'Noto Sans SC',sans-serif">{{ wm }}</span></div>
              </sc-if>
            </div>
          </sc-for>
          <div ref="{{ edRef }}" data-pg="{{ pgId }}" class="wd-ed" contentEditable="true" suppressContentEditableWarning="{{ true }}" spellCheck="false" onInput="{{ onInput }}" onKeyDown="{{ onKey }}" onClick="{{ onEdClick }}" onMouseUp="{{ onEdUp }}" style="flex:1;min-height:200px;font-family:'Noto Serif SC',serif;font-size:11pt;line-height:1.8;column-count:{{ cols }};column-gap:32px;position:relative;opacity:{{ edOp }};pointer-events:{{ edPe }};transition:opacity .2s"></div>
          <sc-for list="{{ hfZones }}" as="z" hint-placeholder-count="0">
            <div title="{{ z.title }}" onDoubleClick="{{ z.onDbl }}" style="position:absolute;left:0;right:0;top:{{ z.top }};bottom:{{ z.bottom }};height:{{ z.h }};z-index:2;box-sizing:border-box;border-top:{{ z.lineT }};border-bottom:{{ z.lineB }}">
              <sc-if value="{{ z.editing }}" hint-placeholder-val="{{ false }}">
                <div ref="{{ hfRef }}" class="wd-hf wd-hfbox" contentEditable="true" suppressContentEditableWarning="{{ true }}" spellCheck="false" onInput="{{ onHfInput }}" onKeyDown="{{ onHfKey }}" style="position:absolute;left:{{ padH }};right:{{ padH }};top:{{ z.bt }};bottom:{{ z.bb }};min-height:1.5em;outline:none"></div>
                <span style="position:absolute;left:{{ padH }};top:{{ z.lt }};bottom:{{ z.lb }};font-size:11px;line-height:18px;padding:0 7px;border-radius:5px;background:var(--k12, #F2F2F7);color:var(--k11, #6E6E73);font-family:'Noto Sans SC',sans-serif;pointer-events:none">{{ z.label }}</span>
              </sc-if>
              <sc-if value="{{ z.showing }}" hint-placeholder-val="{{ true }}">
                <div class="wd-hf" dangerouslySetInnerHTML="{{ z.html }}" style="position:absolute;left:{{ padH }};right:{{ padH }};top:{{ z.bt }};bottom:{{ z.bb }};opacity:{{ hfOp }}"></div>
              </sc-if>
            </div>
