<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./i18n.js"></script><script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./theme-dark.css">
<style>
/* The right-hand format panel of every editor (the design's 定稿 boards): a glass sheet 304px wide, a row of tabs along its top
   edge, then groups one under another, each a small grey title and rows of controls. The controls are the design's own:
   popup buttons with a double chevron, segmented controls, number fields with a stepper, swatches, checkboxes, a switch,
   white buttons and the insert tiles. Colours come from theme-dark.css (--fp-*), so dark follows. */
.fp{position:absolute;inset:0;box-sizing:border-box;padding:12px 14px 0;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;background:var(--fp-bg);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--fp-sh);color:var(--fp-ink);font:12.5px/1.3 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;cursor:default}
.fp button{font-family:var(--font-ui);color:var(--fp-ink);cursor:default;-webkit-tap-highlight-color:transparent}
.fp svg{display:block;flex:none}
.fp-tabs{display:flex;align-items:flex-end;justify-content:space-between;margin:-12px -14px 2px;padding:0 16px;box-shadow:inset 0 -.5px 0 var(--fp-line);flex:none}
.fp-tab{height:38px;padding:0 1px;border:none;background:transparent;font-size:13px;font-weight:400;color:var(--fp-tab)!important;flex:none;white-space:nowrap;transition:color .15s}
.fp-tab:hover{color:var(--fp-title)!important}
.fp-tab[data-on="1"]{font-weight:600;color:var(--fp-ink)!important;box-shadow:inset 0 -2px 0 var(--fp-ink)}
.fp-tab[data-ctx="1"]{color:var(--fp-accent)!important}
.fp-tab[data-ctx="1"][data-on="1"]{box-shadow:inset 0 -2px 0 var(--fp-accent)}
.fp-scroll{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;margin:0 -14px;padding:0 14px 12px}
.fp-scroll::-webkit-scrollbar{width:11px}
.fp-scroll::-webkit-scrollbar-track{background:transparent}
.fp-scroll::-webkit-scrollbar-thumb{background-color:var(--fp-thumb);border:4px solid transparent;border-right-width:4px;background-clip:padding-box;border-radius:6px}
.fp-g{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-bottom:.5px solid var(--fp-line)}
.fp-g:last-child{border-bottom:none}
.fp-gt{font-size:11.5px;font-weight:600;color:var(--fp-title)}
.fp-r{display:flex;align-items:center;gap:8px;min-width:0}
.fp-r[data-grid]{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.fp-r[data-wrap="1"]{flex-wrap:wrap;gap:6px}
.fp-sp{flex:1}
.fp-lab{font-size:12.5px;flex:none;white-space:nowrap}
/* popup button: label, then the double chevron */
.fp-sel{position:relative;height:28px;min-width:0;padding:0 8px 0 10px;border:none;border-radius:7px;background:var(--fp-ctl);box-shadow:var(--fp-ctl-sh);font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.fp-sel>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-sel[data-sw="1"]{padding:0 8px 0 6px;justify-content:flex-start}
.fp-sel[data-sw="1"]>span:first-child{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 .5px var(--fp-swb);flex:none}
.fp-sel[data-sw="1"]>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-sel[data-open="1"],.fp-btn[data-open="1"]{box-shadow:var(--fp-ctl-sh),0 0 0 3px var(--fp-ring)}
.fp-sel select,.fp-sel input[type=color]{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:none;opacity:0;cursor:default;-webkit-appearance:none;appearance:none}
.fp-chev{display:flex;color:var(--fp-chev);flex:none}
/* segmented control: a grey track, the chosen segment raised in white */
.fp-seg{display:flex;padding:2px;border-radius:8px;background:var(--fp-seg);min-width:0;box-sizing:border-box}
.fp-seg>button{flex:1;min-width:0;height:24px;padding:0;border:none;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center;font-size:12.5px;white-space:nowrap;transition:background .15s,box-shadow .15s}
.fp-seg>button[data-on="1"]{background:var(--fp-on);box-shadow:var(--fp-on-sh)}
.fp-seg>button:disabled{opacity:.35}
/* number field with its stepper */
.fp-num{display:flex;align-items:center;gap:4px;flex:none}
.fp-num input{height:28px;box-sizing:border-box;padding:0 9px;border:none;border-radius:7px;background:var(--fp-ctl);box-shadow:var(--fp-ctl-sh);font:12.5px var(--font-ui);color:var(--fp-ink);font-variant-numeric:tabular-nums;outline:none;-webkit-user-select:text;user-select:text}
.fp-num input:focus,.fp-in:focus,.fp-cmt textarea:focus,.fp-cmt input:focus{box-shadow:var(--fp-ctl-sh),0 0 0 3px var(--fp-ring)}
.fp-step{width:18px;height:28px;border-radius:6px;background:var(--fp-ctl);box-shadow:var(--fp-ctl-sh);display:flex;flex-direction:column;align-items:center;justify-content:center}
.fp-step>button{width:16px;height:12px;padding:0;border:none;background:transparent;color:var(--fp-step)!important;display:flex;align-items:center;justify-content:center}
/* checkbox and switch */
.fp-range{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.fp-range input{flex:1;min-width:0;height:18px;margin:0;accent-color:var(--fp-accent)}
.fp-range .fp-lab{width:44px}
.fp-rv{width:30px;text-align:right;font-size:12px;color:var(--fp-title);font-variant-numeric:tabular-nums;flex:none}
.fp-chk{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.fp-chk input{accent-color:#007AFF;width:15px;height:15px;margin:0;flex:none}
.fp-sw{width:38px;height:22px;padding:0;border:none;border-radius:999px;background:var(--fp-sw);position:relative;flex:none;transition:background .2s}
.fp-sw[data-on="1"]{background:#34C759}
.fp-sw>span{position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s cubic-bezier(.2,1,.3,1)}
.fp-sw[data-on="1"]>span{left:18px}
/* buttons */
.fp-btn{height:28px;min-width:0;padding:0 10px;border:none;border-radius:7px;background:var(--fp-ctl);box-shadow:var(--fp-ctl-sh);font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;white-space:nowrap}
.fp-btn>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.fp-r[data-tight] .fp-btn{padding:0 6px;gap:4px}
.fp-btn[data-on="1"]{color:var(--fp-accent)!important;box-shadow:var(--fp-ctl-sh),inset 0 0 0 1px var(--fp-accent)}
.fp-btn:disabled,.fp-sel:disabled,.fp-card:disabled{opacity:.4}
.fp-btn:active:not(:disabled),.fp-card:active:not(:disabled),.fp-sel:active:not(:disabled){filter:brightness(.96)}
.fp-chip{height:26px;padding:0 10px;border:none;border-radius:999px;background:var(--fp-soft);font:12px 'Noto Serif SC',serif;white-space:nowrap}
.fp-chip[data-on="1"]{background:var(--fp-on);box-shadow:var(--fp-on-sh)}
.fp-link{align-self:flex-start;padding:0;border:none;background:transparent;font-size:12.5px;color:var(--fp-danger)!important}
.fp-link:disabled{opacity:.4}
/* A− 12 A+ */
.fp-size{flex:1;min-width:0;height:30px;border-radius:8px;background:var(--fp-ctl);box-shadow:var(--fp-ctl-sh);display:flex;align-items:center;overflow:hidden}
.fp-size>button{height:100%;padding:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.fp-size>button:first-child,.fp-size>button:last-child{width:34px}
.fp-size>button:nth-child(3){flex:1;min-width:56px;padding:0 6px;font-size:13px;font-variant-numeric:tabular-nums;gap:4px}
.fp-size>i{width:.5px;height:16px;background:var(--fp-line);flex:none}
.fp-a{display:flex;align-items:baseline}
.fp-a>b{font-weight:500}
.fp-a>span{font-size:9px;margin-left:1px}
/* insert tiles, table styles */
.fp-card{height:64px;padding:0;border:none;border-radius:12px;background:var(--fp-ctl);box-shadow:var(--fp-card-sh);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0}
.fp-tsty{height:44px;padding:5px;border:none;border-radius:8px;background:#FFFFFF;box-shadow:0 0 0 .5px var(--fp-tstyb);display:flex;flex-direction:column;gap:2px;min-width:0} /* theme: keep — a table style's own colours on white paper */
.fp-tsty[data-on="1"]{box-shadow:0 0 0 1.5px #007AFF}
.fp-tsty>span{height:5px;border-radius:1px;flex:none}
.fp-tsty>span:first-child{height:7px;border-radius:2px}
/* 审阅: the counts, a comment, the find fields */
.fp-stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.fp-stat>b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.fp-stat>span{font-size:11.5px;color:var(--fp-title)}
.fp-in{width:100%;height:28px;box-sizing:border-box;padding:0 10px;border:none;border-radius:7px;background:var(--fp-ctl);box-shadow:var(--fp-ctl-sh);font:12.5px var(--font-ui);color:var(--fp-ink);outline:none;-webkit-user-select:text;user-select:text}
.fp-in::placeholder,.fp-cmt textarea::placeholder,.fp-cmt input::placeholder{color:var(--fp-tab)}
.fp-cmt{display:flex;gap:10px;padding:10px;border-radius:10px;background:var(--fp-soft);box-shadow:inset 0 0 0 1px var(--fp-cmtb)}
.fp-cmt[data-on="1"]{box-shadow:inset 0 0 0 1.5px #E3B25A}
.fp-cmt[data-done="1"]>div{opacity:.55}
.fp-av{width:24px;height:24px;border-radius:50%;color:#FFFFFF;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.fp-cmt>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fp-cmt-h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fp-title)}
.fp-cmt-h>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-cmt-h>button{padding:0;border:none;background:transparent;font-size:12px;color:var(--fp-title)!important;opacity:0;transition:opacity .15s}
.fp-cmt:hover .fp-cmt-h>button,.fp-cmt[data-on="1"] .fp-cmt-h>button{opacity:1}
.fp-cmt-t{font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.fp-cmt-q{font-size:11.5px;color:var(--fp-title);border-left:2px solid #E3B25A;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-cmt textarea,.fp-cmt input{width:100%;box-sizing:border-box;margin-top:3px;padding:5px 8px;border:none;border-radius:6px;background:var(--fp-ctl);box-shadow:var(--fp-ctl-sh);font:12.5px/1.5 var(--font-ui);color:var(--fp-ink);outline:none;resize:vertical;-webkit-user-select:text;user-select:text}
.fp-cmt input{height:26px;padding:0 8px}
.fp-rep{display:flex;gap:6px;margin-top:4px;padding-left:8px;border-left:2px solid var(--fp-line)}
.fp-rep .fp-av{width:18px;height:18px;font-size:9.5px}
.fp-empty{font-size:12px;color:var(--fp-title);line-height:1.6}
</style>
</helmet>
<aside class="fp" data-format-panel="1" aria-label="格式面板">
  <nav class="fp-tabs" aria-label="格式标签">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6"><button class="fp-tab" data-panel-tab="{{ t.key }}" data-on="{{ t.onA }}" data-ctx="{{ t.ctxA }}" onMouseDown="{{ keep }}" onClick="{{ t.onClick }}">{{ t.label }}</button></sc-for>
  </nav>
  <div class="fp-scroll" key="{{ scrollKey }}">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
      <section class="fp-g">
        <sc-if value="{{ g.title }}" hint-placeholder-val="{{ true }}"><div class="fp-gt">{{ g.title }}</div></sc-if>
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
          <div class="fp-r" data-grid="{{ r.grid }}" data-wrap="{{ r.wrap }}" data-tight="{{ r.tight }}" style="{{ r.css }}">
            <sc-for list="{{ r.items }}" as="it" hint-placeholder-count="2">
              <sc-if value="{{ it.isSelBtn }}" hint-placeholder-val="{{ true }}">
                <button class="fp-sel" data-open="{{ it.openA }}" title="{{ it.title }}" disabled="{{ it.dis }}" onMouseDown="{{ keep }}" onClick="{{ it.onClick }}" style="{{ it.box }}"><span style="{{ it.lcss }}">{{ it.label }}</span><span class="fp-chev"><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4.5 4 2l2.5 2.5"></path><path d="M1.5 7.5 4 10l2.5-2.5"></path></svg></span></button>
              </sc-if>
              <sc-if value="{{ it.isSelNative }}" hint-placeholder-val="{{ false }}">
                <label class="fp-sel" title="{{ it.title }}" style="{{ it.box }}"><span style="{{ it.lcss }}">{{ it.label }}</span><span class="fp-chev"><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4.5 4 2l2.5 2.5"></path><path d="M1.5 7.5 4 10l2.5-2.5"></path></svg></span><select value="{{ it.value }}" disabled="{{ it.dis }}" onChange="{{ it.onChange }}" aria-label="{{ it.title }}"><sc-for list="{{ it.options }}" as="o" hint-placeholder-count="0"><option value="{{ o.v }}" disabled="{{ o.dis }}">{{ o.l }}</option></sc-for></select></label>
              </sc-if>
              <sc-if value="{{ it.isSwBtn }}" hint-placeholder-val="{{ false }}">
                <button class="fp-sel" data-sw="1" data-open="{{ it.openA }}" title="{{ it.title }}" onMouseDown="{{ keep }}" onClick="{{ it.onClick }}" style="{{ it.box }}"><span style="background:{{ it.color }}"></span><span>{{ it.label }}</span><span class="fp-chev"><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4.5 4 2l2.5 2.5"></path><path d="M1.5 7.5 4 10l2.5-2.5"></path></svg></span></button>
              </sc-if>
              <sc-if value="{{ it.isSwPick }}" hint-placeholder-val="{{ false }}">
                <label class="fp-sel" data-sw="1" title="{{ it.title }}" style="{{ it.box }}"><span style="background:{{ it.color }}"></span><span>{{ it.label }}</span><span class="fp-chev"><svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4.5 4 2l2.5 2.5"></path><path d="M1.5 7.5 4 10l2.5-2.5"></path></svg></span><input type="color" value="{{ it.value }}" onChange="{{ it.onChange }}" aria-label="{{ it.title }}"></label>
              </sc-if>
              <sc-if value="{{ it.isSeg }}" hint-placeholder-val="{{ false }}">
                <div class="fp-seg" role="group" aria-label="{{ it.title }}" style="{{ it.box }}">
                  <sc-for list="{{ it.opts }}" as="o" hint-placeholder-count="3"><button data-on="{{ o.onA }}" aria-label="{{ o.title }}" aria-pressed="{{ o.on }}" title="{{ o.tip }}" disabled="{{ o.dis }}" onMouseDown="{{ keep }}" onClick="{{ o.onClick }}"><sc-if value="{{ o.svg }}" hint-placeholder-val="{{ false }}"><span style="display:flex" dangerouslySetInnerHTML="{{ o.svg }}"></span></sc-if><sc-if value="{{ o.rich }}" hint-placeholder-val="{{ false }}"><span style="{{ o.css }}" dangerouslySetInnerHTML="{{ o.rich }}"></span></sc-if><sc-if value="{{ o.plain }}" hint-placeholder-val="{{ true }}"><span style="{{ o.css }}">{{ o.label }}</span></sc-if></button></sc-for>
                </div>
              </sc-if>
              <sc-if value="{{ it.isNum }}" hint-placeholder-val="{{ false }}">
                <div class="fp-num" style="{{ it.box }}"><sc-if value="{{ it.lab }}" hint-placeholder-val="{{ false }}"><span class="fp-lab" style="width:{{ it.labW }};margin-right:4px">{{ it.lab }}</span></sc-if><input key="{{ it.value }}" defaultValue="{{ it.value }}" aria-label="{{ it.title }}" onKeyDown="{{ it.onKey }}" onBlur="{{ it.onBlur }}" style="width:{{ it.fieldW }}"><span class="fp-step"><button aria-label="增加" title="{{ it.upTip }}" onMouseDown="{{ keep }}" onClick="{{ it.up }}"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"></path></svg></button><button aria-label="减少" title="{{ it.downTip }}" onMouseDown="{{ keep }}" onClick="{{ it.dn }}"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></button></span></div>
              </sc-if>
              <sc-if value="{{ it.isRange }}" hint-placeholder-val="{{ false }}">
                <label class="fp-range" title="{{ it.title }}"><span class="fp-lab">{{ it.label }}</span><input type="range" min="{{ it.min }}" max="{{ it.max }}" step="1" value="{{ it.value }}" onChange="{{ it.onChange }}"><span class="fp-rv">{{ it.text }}</span></label>
              </sc-if>
              <sc-if value="{{ it.isChk }}" hint-placeholder-val="{{ false }}">
                <label class="fp-chk" title="{{ it.title }}" style="{{ it.box }}"><input type="checkbox" checked="{{ it.on }}" disabled="{{ it.dis }}" onMouseDown="{{ keep }}" onChange="{{ it.onChange }}">{{ it.label }}</label>
              </sc-if>
              <sc-if value="{{ it.isSw }}" hint-placeholder-val="{{ false }}">
                <button class="fp-sw" role="switch" aria-checked="{{ it.on }}" aria-label="{{ it.title }}" title="{{ it.title }}" data-on="{{ it.onA }}" onMouseDown="{{ keep }}" onClick="{{ it.onClick }}"><span></span></button>
              </sc-if>
              <sc-if value="{{ it.isBtn }}" hint-placeholder-val="{{ false }}">
                <button class="fp-btn" data-on="{{ it.onA }}" data-open="{{ it.openA }}" title="{{ it.title }}" disabled="{{ it.dis }}" onMouseDown="{{ keep }}" onClick="{{ it.onClick }}" style="{{ it.box }}"><sc-if value="{{ it.svg }}" hint-placeholder-val="{{ false }}"><span style="display:flex" dangerouslySetInnerHTML="{{ it.svg }}"></span></sc-if><span>{{ it.label }}</span></button>
              </sc-if>
              <sc-if value="{{ it.isChip }}" hint-placeholder-val="{{ false }}">
                <button class="fp-chip" data-on="{{ it.onA }}" title="{{ it.title }}" onMouseDown="{{ keep }}" onClick="{{ it.onClick }}" style="{{ it.lcss }}">{{ it.label }}</button>
              </sc-if>
              <sc-if value="{{ it.isLab }}" hint-placeholder-val="{{ false }}"><span class="fp-lab" style="{{ it.box }}">{{ it.label }}</span></sc-if>
              <sc-if value="{{ it.isSp }}" hint-placeholder-val="{{ false }}"><span class="fp-sp"></span></sc-if>
              <sc-if value="{{ it.isSize }}" hint-placeholder-val="{{ false }}">
                <div class="fp-size" style="height:{{ it.h }};flex:{{ it.flex }}"><button aria-label="{{ it.decTitle }}" title="{{ it.decTitle }}" onMouseDown="{{ keep }}" onClick="{{ it.onDec }}" style="width:{{ it.bw }}"><span class="fp-a"><b style="font-size:11px">A</b><span>−</span></span></button><i></i><button title="{{ it.title }}" data-open="{{ it.openA }}" onMouseDown="{{ keep }}" onClick="{{ it.onMenu }}" style="min-width:{{ it.minW }}">{{ it.value }}<span class="fp-chev"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></span></button><i></i><button aria-label="{{ it.incTitle }}" title="{{ it.incTitle }}" onMouseDown="{{ keep }}" onClick="{{ it.onInc }}" style="width:{{ it.bw }}"><span class="fp-a"><b style="font-size:15px">A</b><span>+</span></span></button></div>
              </sc-if>
              <sc-if value="{{ it.isCard }}" hint-placeholder-val="{{ false }}">
                <button class="fp-card" data-open="{{ it.openA }}" title="{{ it.title }}" disabled="{{ it.dis }}" onMouseDown="{{ keep }}" onClick="{{ it.onClick }}"><span style="display:flex" dangerouslySetInnerHTML="{{ it.svg }}"></span><span>{{ it.label }}</span></button>
              </sc-if>
              <sc-if value="{{ it.isTsty }}" hint-placeholder-val="{{ false }}">
                <button class="fp-tsty" data-on="{{ it.onA }}" aria-label="{{ it.title }}" title="{{ it.title }}" onMouseDown="{{ keep }}" onClick="{{ it.onClick }}"><span style="background:{{ it.head }};box-shadow:{{ it.headSh }}"></span><span style="background:{{ it.b1 }};box-shadow:{{ it.rowSh }}"></span><span style="background:{{ it.b2 }};box-shadow:{{ it.rowSh }}"></span><span style="background:{{ it.b1 }};box-shadow:{{ it.rowSh }}"></span><span style="background:{{ it.b2 }};box-shadow:{{ it.lastSh }}"></span></button>
              </sc-if>
              <sc-if value="{{ it.isStat }}" hint-placeholder-val="{{ false }}"><div class="fp-stat"><b>{{ it.n }}</b><span>{{ it.label }}</span></div></sc-if>
              <sc-if value="{{ it.isInput }}" hint-placeholder-val="{{ false }}">
                <input class="fp-in" ref="{{ it.ref }}" value="{{ it.value }}" placeholder="{{ it.label }}" aria-label="{{ it.label }}" onChange="{{ it.onChange }}" onKeyDown="{{ it.onKey }}">
              </sc-if>
              <sc-if value="{{ it.isLink }}" hint-placeholder-val="{{ false }}"><button class="fp-link" disabled="{{ it.dis }}" onMouseDown="{{ keep }}" onClick="{{ it.onClick }}">{{ it.label }}</button></sc-if>
              <sc-if value="{{ it.isEmpty }}" hint-placeholder-val="{{ false }}"><div class="fp-empty">{{ it.label }}</div></sc-if>
              <sc-if value="{{ it.isCmt }}" hint-placeholder-val="{{ false }}">
                <div class="fp-cmt" data-on="{{ it.onA }}" data-done="{{ it.doneA }}" onClick="{{ it.onClick }}" style="flex:1">
                  <span class="fp-av" style="background:{{ it.avBg }}">{{ it.av }}</span>
                  <div>
