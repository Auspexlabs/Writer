<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./i18n.js"></script><script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-edroot="1" tabIndex="-1" onKeyDown="{{ onRootKey }}" style="height:100%;display:flex;flex-direction:column;min-height:0;box-sizing:border-box;background:transparent;position:relative;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;color:var(--k1, #1D1D1F);padding-top:{{ sheetTopPad }};padding-right:{{ panelPad }};outline:none">
  <sc-if value="{{ showBar }}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;top:10px;left:{{ barL }};right:{{ barR }};z-index:40;display:flex;justify-content:{{ barJ }};pointer-events:none"><div data-glass-bar="1" style="pointer-events:auto;max-width:100%;min-width:0;flex:0 1 auto;display:flex;align-items:center;gap:1px;padding:5px 6px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));font-family:var(--font-ui, -apple-system, 'PingFang SC', system-ui, sans-serif)"><div style="width:{{ spW }};flex:none;display:{{ spD }};align-items:center;justify-content:flex-end;align-self:stretch"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin-right:5px"></span></div>
    <div style="display:flex;align-items:center;gap:1px;min-width:0;overflow-x:auto;scrollbar-width:none">
    <button onMouseDown="{{ md }}" onClick="{{ fileMenu }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--ink-2, rgba(29,29,31,0.62));transition:background .2s ease,color .2s ease,transform .35s cubic-bezier(.2,1.4,.4,1);background:transparent" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.94)">文件</button>
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <button onMouseDown="{{ md }}" onClick="{{ t.onClick }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);font-size:12.5px;cursor:pointer;white-space:nowrap;color:{{ t.color }};transition:background .2s ease,color .2s ease,transform .35s cubic-bezier(.2,1.4,.4,1);background:{{ t.bg }};font-weight:{{ t.weight }}" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.94)">{{ t.label }}</button>
    </sc-for>
    </div><div style="display:flex;align-items:center;flex:none"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span><button onMouseDown="{{ md }}" onClick="{{ aiClick }}" data-ai-btn="1" title="AI 助手" style="height:28px;padding:0 10px 0 8px;border:none;border-radius:var(--ctl-r, 8px);background:{{ aiBg }};box-shadow:{{ aiSh }};cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:{{ aiFg }};white-space:nowrap;flex:none;transition:background .2s,color .2s,transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.95)"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.8c.4 2.9 1.5 4 4.4 4.4-2.9.4-4 1.5-4.4 4.4-.4-2.9-1.5-4-4.4-4.4 2.9-.4 4-1.5 4.4-4.4z"></path><path d="M12.6 10.6c.2 1.2.6 1.6 1.8 1.8-1.2.2-1.6.6-1.8 1.8-.2-1.2-.6-1.6-1.8-1.8 1.2-.2 1.6-.6 1.8-1.8z"></path></svg>AI</button><button onMouseDown="{{ md }}" onClick="{{ playClick }}" title="沉浸书写 Ctrl+." style="width:28px;height:28px;flex:none;border:none;border-radius:var(--ctl-r, 8px);background:transparent;padding:0;color:var(--ink-2, rgba(29,29,31,0.62));cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.9)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.25"></circle><path d="M6.6 5.6v4.8L10.6 8z" fill="currentColor" stroke="none"></path></svg></button></div>
  </div></div>
  <sc-if value="{{ bubbleOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:58px;left:{{ rbx }};z-index:39;width:0;height:0;overflow:visible"><div data-bubble="1" data-pop="{{ tabKey }}" style="position:absolute;left:0;top:0;translate:-50% 0;z-index:39;flex:none;width:max-content;max-width:{{ bMax }};transform-origin:top center;padding:5px 6px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));font-family:var(--font-ui, -apple-system, 'PingFang SC', system-ui, sans-serif);color:var(--ink, #1D1D1F);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px;transform-origin:top left">
      <sc-for list="{{ ribbon }}" as="it" hint-placeholder-count="12">
        <sc-if value="{{ it.isSep }}" hint-placeholder-val="{{ false }}"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span></sc-if>
        <sc-if value="{{ it.isBtn }}" hint-placeholder-val="{{ true }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:28px;min-width:28px;padding:0 8px;border:none;border-radius:var(--ctl-r, 8px);background:{{ it.bg }};font-size:12.5px;font-weight:{{ it.fw }};font-style:{{ it.fs }};text-decoration:{{ it.td }};color:{{ it.color }};cursor:pointer;white-space:nowrap;flex:none" style-hover="background:var(--fill, rgba(0,0,0,0.07))">{{ it.label }}</button>
        </sc-if>
        <sc-if value="{{ it.isAlign }}" hint-placeholder-val="{{ false }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:28px;width:28px;border:none;border-radius:var(--ctl-r, 8px);background:{{ it.bg }};cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:{{ it.ai }};gap:2.5px;padding:0 8px;flex:none" style-hover="background:var(--fill, rgba(0,0,0,0.07))">
            <span style="height:1.6px;width:14px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:9px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:14px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:8px;background:var(--k7, #1D1D1F)"></span>
          </button>
        </sc-if>
        <sc-if value="{{ it.isSel }}" hint-placeholder-val="{{ false }}">
          <select data-val="{{ it.value }}" title="{{ it.title }}" value="{{ it.value }}" onChange="{{ it.onChange }}" style="height:28px;padding:0 4px;border:1px solid var(--line, rgba(0,0,0,0.1));border-radius:var(--ctl-r, 8px);background:transparent;color:var(--ink, #1D1D1F);font-size:12.5px;width:{{ it.w }};flex:none;margin:0 2px">
            <sc-for list="{{ it.options }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}">{{ o.l }}</option></sc-for>
          </select>
        </sc-if>
        <sc-if value="{{ it.isColor }}" hint-placeholder-val="{{ false }}">
          <label title="{{ it.title }}" style="position:relative;height:28px;min-width:28px;padding:0 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--ctl-r, 8px);cursor:pointer;flex:none" style-hover="background:var(--fill, rgba(0,0,0,0.07))">
            <span style="font-size:13px;line-height:1.1;font-weight:{{ it.fw }}">{{ it.label }}</span>
            <span style="width:18px;height:3.5px;border-radius:1px;background:{{ it.swatch }};margin-top:2px;box-shadow:inset 0 0 0 0.5px var(--k56, rgba(0,0,0,0.25))"></span>
            <input type="color" value="{{ it.value }}" onChange="{{ it.onChange }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0">
          </label>
        </sc-if>
        <sc-if value="{{ it.isMenu }}" hint-placeholder-val="{{ false }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onToggle }}" style="height:28px;padding:0 8px;border:none;border-radius:var(--ctl-r, 8px);background:{{ it.bg }};font-size:12.5px;cursor:pointer;white-space:nowrap;flex:none;display:flex;align-items:center;gap:4px" style-hover="background:var(--fill, rgba(0,0,0,0.07))">{{ it.label }}<span style="font-size:8px;color:var(--ink-3, rgba(29,29,31,0.36))">▼</span></button>
        </sc-if>
        <sc-if value="{{ it.isRange }}" hint-placeholder-val="{{ false }}">
          <label title="{{ it.title }}" style="height:28px;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:12.5px;color:var(--ink-2, rgba(29,29,31,0.62));flex:none;white-space:nowrap">{{ it.label }}<input type="range" min="{{ it.min }}" max="{{ it.max }}" step="1" value="{{ it.value }}" onChange="{{ it.onChange }}" style="width:84px;accent-color:var(--k1, #1D1D1F)"><span style="min-width:26px;text-align:right;font-variant-numeric:tabular-nums;color:var(--k1, #1D1D1F)">{{ it.text }}</span></label>
        </sc-if>
      </sc-for>
    </div></div>
  </sc-if>

  </sc-if>
  <sc-if value="{{ formatOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="FormatPanel" tabs="{{ panelTabs }}" groups="{{ panelGroups }}" tab="{{ tabKey }}" enter="{{ panelEnter }}" style="position:absolute;right:8px;top:6px;bottom:8px;width:304px;z-index:44" hint-size="304px,100%"></dc-import>
  </sc-if>
  <div data-flip="1" style="flex:none;height:34px;width:min(760px,calc(100% - 48px));box-sizing:border-box;margin:4px auto 10px;display:grid;grid-template-columns:96px 34px minmax(0,1fr);align-items:center;border-radius:12px;background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));font-size:12.5px;overflow:hidden">
    <input value="{{ nameBox }}" onChange="{{ onNameBox }}" onKeyDown="{{ onNameKey }}" onFocus="{{ onNameFocus }}" onBlur="{{ onNameBlur }}" style="height:100%;border:none;padding:0 14px;font-family:var(--font-ui, -apple-system, 'PingFang SC', system-ui, sans-serif);font-size:12.5px;font-weight:500;outline:none;color:var(--ink, #1D1D1F);background:linear-gradient(var(--line, rgba(0,0,0,0.1)),var(--line, rgba(0,0,0,0.1))) right center/1px 16px no-repeat">
    <button onMouseDown="{{ md }}" onClick="{{ openFx }}" title="插入函数" style="height:100%;border:none;background:transparent;color:var(--ink-3, rgba(29,29,31,0.36));font-family:Georgia,serif;font-style:italic;cursor:pointer;font-size:13px">fx</button>
    <div style="position:relative;height:100%;min-width:0">
      <div ref="{{ fxMirRef }}" style="position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:13px;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;white-space:pre;overflow:hidden;pointer-events:none;color:var(--k1, #1D1D1F)">{{ fxMirror }}</div>
      <input ref="{{ fxRef }}" value="{{ fxValue }}" onChange="{{ onFx }}" onFocus="{{ onFxFocus }}" onKeyDown="{{ onFxKey }}" onKeyUp="{{ syncMirror }}" onScroll="{{ syncMirror }}" onCompositionStart="{{ onCompS }}" onCompositionEnd="{{ onCompE }}" onMouseDown="{{ onInMD }}" spellCheck="false" style="position:absolute;inset:0;width:100%;height:100%;border:none;padding:0 10px;font-size:13px;outline:none;background:transparent;color:{{ fxColor }};caret-color:var(--k1, #1D1D1F);font-family:'IBM Plex Sans','Noto Sans SC',sans-serif">
    </div>
  </div>

  <sc-if value="{{ showFind }}" hint-placeholder-val="{{ false }}">
    <div data-pop="menu" data-glass-bar="1" style="position:absolute;top:104px;right:24px;z-index:38;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 8px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));font-family:var(--font-ui, -apple-system, 'PingFang SC', system-ui, sans-serif);font-size:12.5px">
      <input ref="{{ findRef }}" value="{{ fq }}" onChange="{{ onFq }}" onKeyDown="{{ onFindKey }}" placeholder="查找" style="height:28px;width:140px;padding:0 10px;border:1px solid var(--line, rgba(0,0,0,0.1));border-radius:var(--ctl-r, 8px);background:transparent;color:var(--ink, #1D1D1F);font-size:12.5px;outline:none">
      <input value="{{ fr }}" onChange="{{ onFr }}" placeholder="替换为" style="height:28px;width:140px;padding:0 10px;border:1px solid var(--line, rgba(0,0,0,0.1));border-radius:var(--ctl-r, 8px);background:transparent;color:var(--ink, #1D1D1F);font-size:12.5px;outline:none">
      <button onClick="{{ findNext }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F);font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--line, rgba(0,0,0,0.1))">查找下一个</button>
      <button onClick="{{ replaceOne }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F);font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--line, rgba(0,0,0,0.1))">替换</button>
      <button onClick="{{ replaceAll }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F);font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--line, rgba(0,0,0,0.1))">全部替换</button>
      <sc-for list="{{ findOpts }}" as="o" hint-placeholder-count="3">
        <button onClick="{{ o.onClick }}" title="{{ o.title }}" style="height:28px;padding:0 9px;border:1px solid var(--line, rgba(0,0,0,0.1));border-radius:var(--ctl-r, 8px);background:{{ o.bg }};font-size:12px;cursor:pointer;white-space:nowrap;color:var(--k1, #1D1D1F)">{{ o.label }}</button>
      </sc-for>
      <span style="color:var(--ink-3, rgba(29,29,31,0.36))">{{ fcountText }}</span>
      <div style="flex:1"></div>
      <button onClick="{{ closeFind }}" style="height:28px;padding:0 10px;border:none;background:transparent;font-size:12.5px;cursor:pointer;color:var(--ink-2, rgba(29,29,31,0.62))">关闭</button>
    </div>
  </sc-if>

  <div style="flex:1;min-height:0;display:flex;gap:10px;padding:0 24px">
  <sc-if value="{{ neverThumbs }}" hint-placeholder-val="{{ false }}">
    <div data-thumbpanel="1" style="width:190px;flex:none;margin:-90px 0 0 4px;background:var(--k49, rgba(255,255,255,0.3));backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k64, rgba(255,255,255,0.85)),0 10px 30px var(--k65, rgba(0,0,0,0.07));border-radius:22px;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px;padding-top:60px">
      
      <sc-for list="{{ sheetThumbs }}" as="t" hint-placeholder-count="1">
        <div onClick="{{ t.onClick }}" style="flex:none;padding:8px 10px;border-radius:6px;background:{{ t.bg }};cursor:pointer;display:flex;flex-direction:column;gap:2px" style-hover="background:#EFEFF4">
          <span style="font-size:13px;font-weight:{{ t.fw }}">{{ t.name }}</span><span style="font-size:11.5px;color:var(--k8, #8E8E93)">{{ t.meta }}</span>
        </div>
      </sc-for>
      <sc-if value="{{ hasChartList }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:12px;color:var(--k8, #8E8E93);padding:12px 6px 6px">图表</div>
        <sc-for list="{{ chartList }}" as="c" hint-placeholder-count="0">
          <div onClick="{{ c.onClick }}" style="flex:none;padding:7px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" style-hover="background:#EFEFF4">{{ c.label }}</div>
        </sc-for>
      </sc-if>
    </div>
  </sc-if>
  <div ref="{{ wrapRef }}" style="flex:1;min-width:0;min-height:0;overflow:auto;background:var(--k0, #FFFFFF);position:relative;border-radius:10px;box-shadow:var(--paper-sh, 0 0 0 1px rgba(0,0,0,0.05),0 10px 34px rgba(0,0,0,0.06))">
    <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><div style="padding:24px;font-size:13px;color:var(--k8, #8E8E93)">正在加载计算引擎…</div></sc-if>
    <div style="zoom:{{ zoom }};position:relative;width:{{ gridW }}">
      <sc-if value="{{ hasClip }}" hint-placeholder-val="{{ false }}">
        <div style="position:sticky;top:{{ clipST }};left:{{ clipSL }};width:0;height:0;z-index:{{ clipZ }}"><div style="position:absolute;left:{{ clipL }};top:{{ clipT }};width:{{ clipW }};height:{{ clipH }};border:2px dashed var(--k59, #3F7D5C);pointer-events:none"></div></div>
      </sc-if>
      <div style="position:sticky;top:{{ selST }};left:{{ selSL }};width:0;height:0;z-index:{{ selZ }}"><div style="position:absolute;left:{{ selL }};top:{{ selT }};width:{{ selW }};height:{{ selH }};border:2px solid var(--k59, #3F7D5C);background:{{ selBg }};pointer-events:none;box-sizing:border-box"></div></div>
      <sc-for list="{{ refBoxes }}" as="rb" hint-placeholder-count="0">
        <div style="position:sticky;top:{{ rb.st }};left:{{ rb.sl }};width:0;height:0;z-index:{{ rb.z }}"><div style="position:absolute;left:{{ rb.L }};top:{{ rb.T }};width:{{ rb.W }};height:{{ rb.H }};border:{{ rb.bd }};background:{{ rb.bg }};border-radius:3px;pointer-events:none;box-sizing:border-box"></div></div>
      </sc-for>
      <sc-if value="{{ hasFillPrev }}" hint-placeholder-val="{{ false }}">
        <div style="position:sticky;top:{{ fpST }};left:{{ fpSL }};width:0;height:0;z-index:{{ fpZ }}"><div data-theme-keep="1" style="position:absolute;left:{{ fpL }};top:{{ fpT }};width:{{ fpW }};height:{{ fpH }};border:1.5px dashed #6E6E73;pointer-events:none"></div></div>
      </sc-if>
      <div style="position:sticky;top:{{ selST }};left:{{ selSL }};width:0;height:0;z-index:{{ fhZ }}"><div onMouseDown="{{ onFillDown }}" onDoubleClick="{{ onFillDbl }}" style="position:absolute;left:{{ fhL }};top:{{ fhT }};width:8px;height:8px;background:var(--k59, #3F7D5C);border:1.5px solid var(--k0, #FFFFFF);cursor:crosshair;box-sizing:content-box"></div></div>
      <div ref="{{ inMirRef }}" style="position:absolute;left:{{ inL }};top:{{ inT }};width:{{ inW }};height:{{ inH }};display:{{ inMirD }};align-items:center;padding:0 6px;box-sizing:border-box;font-size:13px;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;white-space:pre;overflow:hidden;background:var(--k0, #FFFFFF);color:var(--k1, #1D1D1F);pointer-events:none;z-index:{{ z.mirror }}">{{ inMirror }}</div>
