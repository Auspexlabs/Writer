<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-edroot="1" tabIndex="-1" onKeyDown="{{ onRootKey }}" style="height:100%;display:flex;flex-direction:column;min-height:0;background:transparent;position:relative;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;color:var(--k1, #1D1D1F);padding-top:58px;outline:none">
  <sc-if value="{{ notPure }}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;top:10px;left:{{ barL }};right:{{ barR }};z-index:40;display:flex;justify-content:{{ barJ }};pointer-events:none"><div data-glass-bar="1" style="pointer-events:auto;max-width:100%;min-width:0;flex:0 1 auto;display:flex;align-items:center;gap:1px;padding:4px;border-radius:999px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1))"><div style="width:{{ spW }};flex:none;display:{{ spD }};align-items:center;justify-content:flex-end;align-self:stretch"><span style="width:1px;height:18px;background:var(--k36, rgba(0,0,0,0.12));margin-right:4px"></span></div>
    <div style="display:flex;align-items:center;gap:1px;min-width:0;overflow-x:auto;scrollbar-width:none">
    <button onMouseDown="{{ md }}" onClick="{{ fileMenu }}" style="height:34px;padding:0 13px;border:none;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--k1, #1D1D1F);transition:background .25s ease,box-shadow .25s ease,transform .35s cubic-bezier(.2,1.4,.4,1);background:transparent" style-hover="background:var(--k30, rgba(255,255,255,0.6))" style-active="transform:scale(0.94)">文件</button>
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <button onMouseDown="{{ md }}" onClick="{{ t.onClick }}" style="height:34px;padding:0 13px;border:none;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--k1, #1D1D1F);transition:background .25s ease,box-shadow .25s ease,transform .35s cubic-bezier(.2,1.4,.4,1);background:{{ t.bg }};box-shadow:{{ t.line }};font-weight:{{ t.weight }}" style-hover="background:var(--k30, rgba(255,255,255,0.6))" style-active="transform:scale(0.94)">{{ t.label }}</button>
    </sc-for>
    </div><div style="display:flex;align-items:center;flex:none"><span style="width:1px;height:18px;background:var(--k60, rgba(0,0,0,0.14));margin:0 4px;flex:none"></span><button onMouseDown="{{ md }}" onClick="{{ aiClick }}" title="AI 助手" style="height:34px;padding:0 13px 0 11px;border:none;border-radius:999px;background:{{ aiBg }};box-shadow:{{ aiSh }};cursor:pointer;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--k1, #1D1D1F);white-space:nowrap;flex:none;transition:background .25s,box-shadow .25s,transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--k20, rgba(255,255,255,0.7))" style-active="transform:scale(0.95)"><span style="font-size:13px;line-height:1">✦</span>AI</button><button onMouseDown="{{ md }}" onClick="{{ playClick }}" title="沉浸书写 Ctrl+." style="width:40px;height:34px;flex:none;border:none;border-radius:999px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,transform .35s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--k20, rgba(255,255,255,0.7))" style-active="transform:scale(0.9)"><span style="width:19px;height:19px;border:1.7px solid var(--k7, #1D1D1F);border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><span style="width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6.5px solid var(--k7, #1D1D1F);margin-left:1.5px"></span></span></button></div>
  </div></div>
  <sc-if value="{{ bubbleOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:58px;left:{{ rbx }};z-index:39;width:0;height:0;overflow:visible"><div data-bubble="1" data-pop="{{ tabKey }}" style="position:absolute;left:0;top:0;translate:-50% 0;z-index:39;flex:none;width:max-content;max-width:{{ bMax }};transform-origin:top center;padding:8px 10px;border-radius:22px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;transform-origin:top left">
      <sc-for list="{{ ribbon }}" as="it" hint-placeholder-count="12">
        <sc-if value="{{ it.isSep }}" hint-placeholder-val="{{ false }}"><span style="width:1px;height:20px;background:var(--k36, rgba(0,0,0,0.12));margin:0 6px;flex:none"></span></sc-if>
        <sc-if value="{{ it.isBtn }}" hint-placeholder-val="{{ true }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:30px;min-width:30px;padding:0 8px;border:none;border-radius:6px;background:{{ it.bg }};font-size:13px;font-weight:{{ it.fw }};font-style:{{ it.fs }};text-decoration:{{ it.td }};color:{{ it.color }};cursor:pointer;white-space:nowrap;flex:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">{{ it.label }}</button>
        </sc-if>
        <sc-if value="{{ it.isAlign }}" hint-placeholder-val="{{ false }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:30px;width:30px;border:none;border-radius:6px;background:{{ it.bg }};cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:{{ it.ai }};gap:2.5px;padding:0 8px;flex:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">
            <span style="height:1.6px;width:14px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:9px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:14px;background:var(--k7, #1D1D1F)"></span><span style="height:1.6px;width:8px;background:var(--k7, #1D1D1F)"></span>
          </button>
        </sc-if>
        <sc-if value="{{ it.isSel }}" hint-placeholder-val="{{ false }}">
          <select data-val="{{ it.value }}" title="{{ it.title }}" value="{{ it.value }}" onChange="{{ it.onChange }}" style="height:28px;padding:0 4px;border:1px solid var(--k17, rgba(0,0,0,0.07));border-radius:9px;background:var(--k30, rgba(255,255,255,0.6));font-size:12.5px;width:{{ it.w }};flex:none;margin:0 2px">
            <sc-for list="{{ it.options }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}">{{ o.l }}</option></sc-for>
          </select>
        </sc-if>
        <sc-if value="{{ it.isColor }}" hint-placeholder-val="{{ false }}">
          <label title="{{ it.title }}" style="position:relative;height:30px;min-width:32px;padding:0 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;flex:none" style-hover="background:var(--k20, rgba(255,255,255,0.7))">
            <span style="font-size:13px;line-height:1.1;font-weight:{{ it.fw }}">{{ it.label }}</span>
            <span style="width:18px;height:3.5px;border-radius:1px;background:{{ it.swatch }};margin-top:2px;box-shadow:inset 0 0 0 0.5px var(--k56, rgba(0,0,0,0.25))"></span>
            <input type="color" value="{{ it.value }}" onChange="{{ it.onChange }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0">
          </label>
        </sc-if>
        <sc-if value="{{ it.isMenu }}" hint-placeholder-val="{{ false }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onToggle }}" style="height:30px;padding:0 8px;border:none;border-radius:6px;background:{{ it.bg }};font-size:13px;cursor:pointer;white-space:nowrap;flex:none;display:flex;align-items:center;gap:4px" style-hover="background:var(--k20, rgba(255,255,255,0.7))">{{ it.label }}<span style="font-size:9px;color:var(--k8, #8E8E93)">▼</span></button>
        </sc-if>
        <sc-if value="{{ it.isRange }}" hint-placeholder-val="{{ false }}">
          <label title="{{ it.title }}" style="height:30px;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:12.5px;color:var(--k11, #6E6E73);flex:none;white-space:nowrap">{{ it.label }}<input type="range" min="{{ it.min }}" max="{{ it.max }}" step="1" value="{{ it.value }}" onChange="{{ it.onChange }}" style="width:84px;accent-color:var(--k1, #1D1D1F)"><span style="min-width:26px;text-align:right;font-variant-numeric:tabular-nums;color:var(--k1, #1D1D1F)">{{ it.text }}</span></label>
        </sc-if>
      </sc-for>
    </div></div>
  </sc-if>

  </sc-if>
  <div style="flex:none;height:36px;margin:8px 12px 10px {{ fxML }};transition:margin .5s cubic-bezier(.2,1,.3,1);display:grid;grid-template-columns:96px 34px minmax(0,1fr);align-items:center;border-radius:999px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k34, rgba(255,255,255,0.9)),0 1px 3px var(--k38, rgba(0,0,0,0.05));font-size:13px;overflow:hidden">
    <input value="{{ nameBox }}" onChange="{{ onNameBox }}" onKeyDown="{{ onNameKey }}" onFocus="{{ onNameFocus }}" onBlur="{{ onNameBlur }}" style="height:100%;border:none;border-right:1px solid var(--k29, rgba(0,0,0,0.1));padding:0 14px;font-size:12.5px;font-weight:500;outline:none;background:transparent">
    <button onMouseDown="{{ md }}" onClick="{{ openFx }}" title="插入函数" style="height:100%;border:none;background:transparent;color:var(--k8, #8E8E93);font-family:'Noto Serif SC',serif;font-style:italic;cursor:pointer;font-size:13px">fx</button>
    <div style="position:relative;height:100%;min-width:0">
      <div ref="{{ fxMirRef }}" style="position:absolute;inset:0;display:flex;align-items:center;padding:0 10px;font-size:13px;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;white-space:pre;overflow:hidden;pointer-events:none;color:var(--k1, #1D1D1F)">{{ fxMirror }}</div>
      <input ref="{{ fxRef }}" value="{{ fxValue }}" onChange="{{ onFx }}" onFocus="{{ onFxFocus }}" onKeyDown="{{ onFxKey }}" onKeyUp="{{ syncMirror }}" onScroll="{{ syncMirror }}" onCompositionStart="{{ onCompS }}" onCompositionEnd="{{ onCompE }}" onMouseDown="{{ onInMD }}" spellCheck="false" style="position:absolute;inset:0;width:100%;height:100%;border:none;padding:0 10px;font-size:13px;outline:none;background:transparent;color:{{ fxColor }};caret-color:var(--k1, #1D1D1F);font-family:'IBM Plex Sans','Noto Sans SC',sans-serif">
    </div>
  </div>

  <sc-if value="{{ showFind }}" hint-placeholder-val="{{ false }}">
    <div data-pop="menu" data-glass-bar="1" style="position:absolute;top:104px;right:24px;z-index:38;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;border-radius:999px;background:linear-gradient(180deg,var(--k15, rgba(255,255,255,0.62)),var(--k16, rgba(255,255,255,0.34)));backdrop-filter:blur(10px) saturate(190%);-webkit-backdrop-filter:blur(10px) saturate(190%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k18, rgba(255,255,255,0.95)),inset 0 -1px 1px var(--k21, rgba(255,255,255,0.3)),0 12px 32px var(--k22, rgba(0,0,0,0.12)),0 1px 3px var(--k19, rgba(0,0,0,0.1));font-size:13px">
      <input ref="{{ findRef }}" value="{{ fq }}" onChange="{{ onFq }}" onKeyDown="{{ onFindKey }}" placeholder="查找" style="height:30px;width:140px;padding:0 12px;border:1px solid var(--k17, rgba(0,0,0,0.07));border-radius:999px;background:var(--k20, rgba(255,255,255,0.7));font-size:13px;outline:none">
      <input value="{{ fr }}" onChange="{{ onFr }}" placeholder="替换为" style="height:30px;width:140px;padding:0 12px;border:1px solid var(--k17, rgba(0,0,0,0.07));border-radius:999px;background:var(--k20, rgba(255,255,255,0.7));font-size:13px;outline:none">
      <button onClick="{{ findNext }}" style="height:30px;padding:0 12px;border:none;border-radius:999px;background:var(--k42, rgba(255,255,255,0.55));font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--k50, rgba(255,255,255,0.9))">查找下一个</button>
      <button onClick="{{ replaceOne }}" style="height:30px;padding:0 12px;border:none;border-radius:999px;background:var(--k42, rgba(255,255,255,0.55));font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--k50, rgba(255,255,255,0.9))">替换</button>
      <button onClick="{{ replaceAll }}" style="height:30px;padding:0 12px;border:none;border-radius:999px;background:var(--k42, rgba(255,255,255,0.55));font-size:12.5px;cursor:pointer;white-space:nowrap" style-hover="background:var(--k50, rgba(255,255,255,0.9))">全部替换</button>
      <span style="color:var(--k8, #8E8E93)">{{ fcountText }}</span>
      <div style="flex:1"></div>
      <button onClick="{{ closeFind }}" style="height:28px;padding:0 10px;border:none;background:transparent;font-size:12.5px;cursor:pointer;color:var(--k11, #6E6E73)">关闭</button>
    </div>
  </sc-if>

  <div style="flex:1;min-height:0;display:flex;gap:10px;padding:0 12px">
  <sc-if value="{{ neverThumbs }}" hint-placeholder-val="{{ false }}">
    <div data-thumbpanel="1" style="width:190px;flex:none;margin:-90px 0 0 4px;background:var(--k49, rgba(255,255,255,0.3));backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--k17, rgba(0,0,0,0.07));box-shadow:inset 0 1px 0 var(--k64, rgba(255,255,255,0.85)),0 10px 30px var(--k65, rgba(0,0,0,0.07));border-radius:22px;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px;padding-top:60px">
      
      <sc-for list="{{ sheetThumbs }}" as="t" hint-placeholder-count="1">
        <div onClick="{{ t.onClick }}" style="flex:none;padding:8px 10px;border-radius:6px;background:{{ t.bg }};cursor:pointer;display:flex;flex-direction:column;gap:2px" style-hover="background:#EFEFF4">
          <span style="font-size:13px;font-weight:{{ t.fw }}">{{ t.name }}</span><span style="font-size:11.5px;color:var(--k8, #8E8E93)">{{ t.meta }}</span>
        </div>
      </sc-for>
      <sc-if value="{{ hasChartList }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:12px;color:var(--k8, #8E8E93);padding:12px 6px 6px">图表</div>
        <sc-for list="{{ chartList }}" as="c" hint-placeholder-count="0">
          <div onClick="{{ c.onClick }}" style="flex:none;padding:7px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" style-hover="background:#EFEFF4">{{ c.label }}</div>
        </sc-for>
      </sc-if>
    </div>
  </sc-if>
  <div ref="{{ wrapRef }}" style="flex:1;min-width:0;min-height:0;overflow:auto;background:var(--k0, #FFFFFF);position:relative;border-radius:16px 16px 0 0;box-shadow:0 1px 3px var(--k53, rgba(0,0,0,0.08)),0 0 0 1px var(--k66, rgba(0,0,0,0.06))">
    <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><div style="padding:24px;font-size:13px;color:var(--k8, #8E8E93)">正在加载计算引擎…</div></sc-if>
    <div style="zoom:{{ zoom }};position:relative;width:{{ gridW }}">
      <sc-if value="{{ hasClip }}" hint-placeholder-val="{{ false }}">
        <div style="position:sticky;top:{{ clipST }};left:{{ clipSL }};width:0;height:0;z-index:{{ clipZ }}"><div style="position:absolute;left:{{ clipL }};top:{{ clipT }};width:{{ clipW }};height:{{ clipH }};border:2px dashed var(--k59, #3F7D5C);pointer-events:none"></div></div>
      </sc-if>
      <div style="position:sticky;top:{{ selST }};left:{{ selSL }};width:0;height:0;z-index:{{ selZ }}"><div style="position:absolute;left:{{ selL }};top:{{ selT }};width:{{ selW }};height:{{ selH }};border:2px solid var(--k59, #3F7D5C);background:{{ selBg }};pointer-events:none;box-sizing:border-box"></div></div>
      <sc-for list="{{ refBoxes }}" as="rb" hint-placeholder-count="0">
        <div style="position:sticky;top:{{ rb.st }};left:{{ rb.sl }};width:0;height:0;z-index:{{ rb.z }}"><div style="position:absolute;left:{{ rb.L }};top:{{ rb.T }};width:{{ rb.W }};height:{{ rb.H }};border:{{ rb.bd }};background:{{ rb.bg }};border-radius:3px;pointer-events:none;box-sizing:border-box"></div></div>
      </sc-for>
      <sc-if value="{{ hasFillPrev }}" hint-placeholder-val="{{ false }}">
        <div style="position:sticky;top:{{ fpST }};left:{{ fpSL }};width:0;height:0;z-index:{{ fpZ }}"><div data-theme-keep="1" style="position:absolute;left:{{ fpL }};top:{{ fpT }};width:{{ fpW }};height:{{ fpH }};border:1.5px dashed #6E6E73;pointer-events:none"></div></div>
      </sc-if>
      <div style="position:sticky;top:{{ selST }};left:{{ selSL }};width:0;height:0;z-index:{{ fhZ }}"><div onMouseDown="{{ onFillDown }}" onDoubleClick="{{ onFillDbl }}" style="position:absolute;left:{{ fhL }};top:{{ fhT }};width:8px;height:8px;background:var(--k59, #3F7D5C);border:1.5px solid var(--k0, #FFFFFF);cursor:crosshair;box-sizing:content-box"></div></div>
      <div ref="{{ inMirRef }}" style="position:absolute;left:{{ inL }};top:{{ inT }};width:{{ inW }};height:{{ inH }};display:{{ inMirD }};align-items:center;padding:0 6px;box-sizing:border-box;font-size:13px;font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;white-space:pre;overflow:hidden;background:var(--k0, #FFFFFF);color:var(--k1, #1D1D1F);pointer-events:none;z-index:{{ z.mirror }}">{{ inMirror }}</div>
      <input ref="{{ inRef }}" value="{{ inVal }}" onChange="{{ onInChange }}" onKeyDown="{{ onInKey }}" onKeyUp="{{ syncMirror }}" onScroll="{{ syncMirror }}" onCompositionStart="{{ onCompS }}" onCompositionEnd="{{ onCompE }}" onMouseDown="{{ onInMD }}" onCopy="{{ onCopy }}" onCut="{{ onCut }}" onPaste="{{ onPaste }}" onBlur="{{ onInBlur }}" spellCheck="false" autoComplete="off" style="position:absolute;left:{{ inL }};top:{{ inT }};width:{{ inW }};height:{{ inH }};opacity:{{ inOp }};pointer-events:{{ inPe }};z-index:{{ z.editor }};border:none;outline:2px solid var(--k59, #3F7D5C);padding:0 6px;font-size:13px;background:{{ inBg }};color:{{ inColor }};caret-color:{{ inCaret }};font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;box-shadow:0 2px 8px var(--k22, rgba(0,0,0,0.12))">
      <sc-for list="{{ pics }}" as="pc" hint-placeholder-count="0">
        <div style="position:sticky;top:{{ pc.st }};left:{{ pc.sl }};width:0;height:0;z-index:{{ pc.z }}"><div data-pic="{{ pc.id }}" onMouseDown="{{ pc.onSel }}" title="{{ pc.alt }}" style="position:absolute;left:{{ pc.x }};top:{{ pc.y }};width:{{ pc.w }};height:{{ pc.h }};transform:{{ pc.tf }};opacity:{{ pc.op }};outline:{{ pc.line }};outline-offset:1px;cursor:pointer">
          <div style="position:absolute;inset:0;{{ pc.frame }}"><img src="{{ pc.src }}" alt="" draggable="false" style="{{ pc.image }}"></div>
        </div></div>
      </sc-for>
      <sc-for list="{{ charts }}" as="ch" hint-placeholder-count="0">
        <div style="position:sticky;top:{{ ch.st }};left:{{ ch.sl }};width:0;height:0;z-index:{{ ch.z }}"><div onMouseDown="{{ ch.onSel }}" style="position:absolute;left:{{ ch.x }};top:{{ ch.y }};width:{{ ch.w }};height:{{ ch.h }};background:var(--k0, #FFFFFF);border:1px solid {{ ch.border }};border-radius:8px;box-shadow:0 4px 16px var(--k19, rgba(0,0,0,0.1));display:flex;flex-direction:column;overflow:hidden">
          <div onMouseDown="{{ ch.onDrag }}" onDoubleClick="{{ ch.onRename }}" style="height:34px;flex:none;order:-2;display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;cursor:move">
            <span style="flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ ch.title }}</span>
            <button onMouseDown="{{ md }}" onClick="{{ ch.onMenu }}" title="图表类型与图例" style="height:24px;padding:0 7px;border:none;border-radius:5px;background:transparent;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap" style-hover="background:var(--k37, rgba(0,0,0,0.05))">{{ ch.typeLabel }}<span style="font-size:9px;color:var(--k8, #8E8E93)">▼</span></button>
            <button onMouseDown="{{ md }}" onClick="{{ ch.onDelete }}" title="删除图表" style="height:24px;width:24px;border:none;border-radius:5px;background:transparent;font-size:13px;cursor:pointer;color:var(--k8, #8E8E93)">✕</button>
