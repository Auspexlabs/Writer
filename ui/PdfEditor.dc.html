<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./i18n.js"></script><script src="./vendor/offline.js"></script><script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.pt-tl{position:absolute;left:0;top:0;overflow:hidden;line-height:1;transform-origin:0 0;text-size-adjust:none;-webkit-text-size-adjust:none;forced-color-adjust:none;user-select:text;-webkit-user-select:text}
.pt-tl>span{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.pt-tl br{user-select:none}
.pt-tl ::selection{background:rgba(0,110,255,0.32)} /* theme: keep */
.pt-tl .pt-hit{color:transparent;background:rgba(255,205,0,0.5);border-radius:2px} /* theme: keep */
.pt-tl .pt-hit.cur{background:rgba(255,130,0,0.62)} /* theme: keep */
[data-ph]:empty::before{content:attr(data-ph);color:var(--ink-3, rgba(29,29,31,0.36))}
.pt-range{-webkit-appearance:none;appearance:none;width:60px;height:3px;border-radius:2px;background:var(--line, rgba(0,0,0,0.1));outline:none;cursor:pointer}
.pt-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:9px;height:9px;border-radius:50%;background:var(--ink-2, rgba(29,29,31,0.62));border:none}
</style>
</helmet>
<div data-edroot="1" tabIndex="-1" onKeyDown="{{ onRootKey }}" style="height:100%;display:flex;flex-direction:column;min-height:0;background:transparent;position:relative;box-sizing:border-box;padding-right:{{ panelPad }};transition:padding-right .28s cubic-bezier(.2,.8,.2,1);outline:none;font-family:var(--font-ui, -apple-system,'PingFang SC','Segoe UI','Microsoft YaHei UI',system-ui,sans-serif);color:var(--ink, #1D1D1F)">
  <sc-if value="{{ showBar }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;top:10px;left:{{ barL }};right:{{ barR }};z-index:40;display:flex;justify-content:{{ barJ }};pointer-events:none"><div data-glass-bar="1" style="pointer-events:auto;max-width:100%;min-width:0;flex:0 1 auto;display:flex;align-items:center;gap:1px;padding:5px 6px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95))"><div style="width:{{ spW }};flex:none;display:{{ spD }};align-items:center;justify-content:flex-end;align-self:stretch"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin-right:5px"></span></div>
    <div style="display:flex;align-items:center;gap:1px;min-width:0;overflow-x:auto;scrollbar-width:none">
      <button onMouseDown="{{ md }}" onClick="{{ fileMenu }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--ink-2, rgba(29,29,31,0.62));background:transparent;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.94)">文件</button>
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button onMouseDown="{{ md }}" onClick="{{ t.onClick }}" style="height:28px;padding:0 10px;border:none;border-radius:var(--ctl-r, 8px);font-size:12.5px;font-weight:{{ t.fw }};cursor:pointer;white-space:nowrap;color:{{ t.fg }};background:{{ t.bg }};transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.94)">{{ t.label }}</button>
      </sc-for>
      </div><div style="display:flex;align-items:center;flex:none"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span><button onMouseDown="{{ md }}" onClick="{{ aiClick }}" data-ai-btn="1" title="AI 助手" style="height:28px;padding:0 10px 0 8px;border:none;border-radius:var(--ctl-r, 8px);background:{{ aiBg }};cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:{{ aiFg }};white-space:nowrap;flex:none;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.95)"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.8c.4 2.9 1.5 4 4.4 4.4-2.9.4-4 1.5-4.4 4.4-.4-2.9-1.5-4-4.4-4.4 2.9-.4 4-1.5 4.4-4.4z"></path><path d="M12.6 10.6c.2 1.2.6 1.6 1.8 1.8-1.2.2-1.6.6-1.8 1.8-.2-1.2-.6-1.6-1.8-1.8 1.2-.2 1.6-.6 1.8-1.8z"></path></svg>AI</button><button onMouseDown="{{ md }}" onClick="{{ playClick }}" title="沉浸书写 Ctrl+." style="width:28px;height:28px;padding:0;flex:none;border:none;border-radius:var(--ctl-r, 8px);background:transparent;color:var(--ink-2, rgba(29,29,31,0.62));cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)" style-active="transform:scale(0.9)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.25"></circle><path d="M6.6 5.6v4.8L10.6 8z" fill="currentColor" stroke="none"></path></svg></button></div>
    </div></div>
    <sc-if value="{{ bubbleOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:58px;left:{{ rbx }};z-index:39;width:0;height:0;overflow:visible"><div data-bubble="1" data-pop="{{ tabKey }}" style="position:absolute;left:0;top:0;translate:-50% 0;z-index:39;flex:none;width:max-content;max-width:{{ bMax }};transform-origin:top center;padding:5px 6px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px">
      <sc-for list="{{ tools }}" as="it" hint-placeholder-count="0">
        <sc-if value="{{ it.isSep }}" hint-placeholder-val="{{ false }}"><span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span></sc-if>
        <sc-if value="{{ it.isBtn }}" hint-placeholder-val="{{ true }}">
          <button title="{{ it.title }}" onMouseDown="{{ md }}" onClick="{{ it.onClick }}" style="height:28px;min-width:28px;padding:0 9px;border:none;border-radius:var(--ctl-r, 8px);background:{{ it.bg }};font-size:12.5px;cursor:pointer;white-space:nowrap;flex:none;color:{{ it.color }};transition:background .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07))" style-active="transform:scale(0.92)">{{ it.label }}</button>
        </sc-if>
        <sc-if value="{{ it.isColor }}" hint-placeholder-val="{{ false }}">
          <label title="颜色" style="position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--ctl-r, 8px);cursor:pointer;flex:none" style-hover="background:var(--fill, rgba(0,0,0,0.07))">
            <span style="width:16px;height:16px;border-radius:50%;background:{{ it.value }};box-shadow:inset 0 0 0 1px var(--k45, rgba(0,0,0,0.2))"></span>
            <input type="color" value="{{ it.value }}" onChange="{{ it.onChange }}" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
          </label>
        </sc-if>
        <sc-if value="{{ it.isText }}" hint-placeholder-val="{{ false }}">
          <input value="{{ it.value }}" placeholder="{{ it.ph }}" title="{{ it.title }}" onChange="{{ it.onChange }}" onKeyDown="{{ it.onKey }}" style="height:26px;width:118px;padding:0 9px;border:1px solid var(--line, rgba(0,0,0,0.1));border-radius:var(--ctl-r, 8px);background:var(--tab-bg, rgba(255,255,255,0.92));font:inherit;font-size:12.5px;color:var(--ink, #1D1D1F);outline:none;margin:0 2px;flex:none">
        </sc-if>
        <sc-if value="{{ it.isSel }}" hint-placeholder-val="{{ false }}">
          <select data-val="{{ it.value }}" title="字号" value="{{ it.value }}" onChange="{{ it.onChange }}" style="height:26px;padding:0 4px;border:1px solid var(--line, rgba(0,0,0,0.1));border-radius:var(--ctl-r, 8px);background:var(--tab-bg, rgba(255,255,255,0.92));color:var(--ink, #1D1D1F);font-size:12.5px;width:58px;flex:none;margin:0 2px">
            <sc-for list="{{ it.options }}" as="o" hint-placeholder-count="3"><option value="{{ o }}">{{ o }}</option></sc-for>
          </select>
        </sc-if>
      </sc-for>
    </div></div>
    </sc-if>
  </sc-if>
  <sc-if value="{{ formatOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="FormatPanel" tabs="{{ panelTabs }}" groups="{{ panelGroups }}" tab="{{ tabKey }}" style="position:absolute;right:8px;top:6px;bottom:8px;width:304px;z-index:44" hint-size="304px,100%"></dc-import>
  </sc-if>
  <input ref="{{ mergeRef }}" type="file" accept=".pdf,application/pdf" multiple="{{ true }}" onChange="{{ onMergePick }}" style="display:none">
  <sc-if value="{{ findOpen }}" hint-placeholder-val="{{ false }}">
    <div data-pop="find" style="position:absolute;top:{{ findTop }};right:{{ findRight }};z-index:41;height:36px;display:flex;align-items:center;gap:4px;padding:0 5px 0 12px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95))">
      <input ref="{{ findRef }}" value="{{ findQ }}" onChange="{{ onFindInput }}" onKeyDown="{{ onFindKey }}" placeholder="查找" style="width:170px;height:28px;border:none;background:transparent;outline:none;font:inherit;font-size:13px;color:var(--ink, #1D1D1F)">
      <span style="min-width:48px;text-align:center;font-size:11.5px;color:var(--ink-3, rgba(29,29,31,0.36));white-space:nowrap">{{ findCount }}</span>
      <button onMouseDown="{{ md }}" onClick="{{ findPrev }}" title="上一个 ⇧⌘G" style="width:26px;height:26px;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:15px;color:var(--ink-2, rgba(29,29,31,0.62));cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)">‹</button>
      <button onMouseDown="{{ md }}" onClick="{{ findNext }}" title="下一个 ⌘G" style="width:26px;height:26px;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:15px;color:var(--ink-2, rgba(29,29,31,0.62));cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink, #1D1D1F)">›</button>
      <button onMouseDown="{{ md }}" onClick="{{ closeFind }}" title="关闭" style="width:26px;height:26px;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:11px;color:var(--ink-3, rgba(29,29,31,0.36));cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink-2, rgba(29,29,31,0.62))">✕</button>
    </div>
  </sc-if>
  <sc-if value="{{ selPopOn }}" hint-placeholder-val="{{ false }}">
    <div data-pop="sel" onMouseDown="{{ md }}" style="position:absolute;left:{{ spX }};top:{{ spY }};translate:-50% 0;z-index:42;height:36px;display:flex;align-items:center;gap:1px;padding:0 4px;border-radius:var(--glass-r, 14px);background:var(--glass-bg, linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.72)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-bd, rgba(0,0,0,0.07));box-shadow:var(--glass-sh, 0 8px 24px rgba(0,0,0,0.07),inset 0 1px 0 rgba(255,255,255,0.95));white-space:nowrap">
      <button onClick="{{ markHl }}" style="height:28px;padding:0 9px;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:12.5px;color:var(--ink, #1D1D1F);cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07))">高亮</button>
      <button onClick="{{ markUl }}" style="height:28px;padding:0 9px;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:12.5px;color:var(--ink, #1D1D1F);cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07))">下划线</button>
      <button onClick="{{ markSo }}" style="height:28px;padding:0 9px;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:12.5px;color:var(--ink, #1D1D1F);cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07))">删除线</button>
      <span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span>
      <sc-for list="{{ swatches }}" as="s" hint-placeholder-count="4"><button onClick="{{ s.onClick }}" title="{{ s.title }}" style="width:22px;height:22px;flex:none;border-radius:50%;border:none;background:{{ s.color }};box-shadow:{{ s.ring }};cursor:pointer;margin:0 1px"></button></sc-for>
      <span style="width:1px;height:18px;background:var(--line, rgba(0,0,0,0.1));margin:0 5px;flex:none"></span>
      <button onClick="{{ copySel }}" style="height:28px;padding:0 9px;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:12.5px;color:var(--ink, #1D1D1F);cursor:pointer" style-hover="background:var(--fill, rgba(0,0,0,0.07))">复制</button>
    </div>
  </sc-if>
  <div style="flex:1;min-height:0;display:grid;grid-template-columns:{{ cols }};transition:grid-template-columns .55s cubic-bezier(.2,1,.3,1)">
    <sc-if value="{{ showThumbs }}" hint-placeholder-val="{{ false }}">
      <div data-thumbpanel="1" data-pop="left" style="position:absolute;top:10px;left:10px;bottom:10px;width:{{ panelW }};z-index:45;display:flex;flex-direction:column;min-height:0;border-radius:var(--panel-r, 16px);overflow:hidden;background:var(--panel-bg, linear-gradient(180deg,rgba(255,255,255,0.84),rgba(255,255,255,0.7)));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--panel-bd, rgba(0,0,0,0.06));box-shadow:var(--panel-sh, 0 16px 40px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.95));transition:width .45s cubic-bezier(.2,1,.3,1)"><div style="height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px">
        <sc-if value="{{ hasOutline }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:1px;padding:2px;border-radius:var(--tab-r, 9px);background:var(--fill, rgba(0,0,0,0.07))"><button onClick="{{ showThumbList }}" style="height:24px;padding:0 10px;border:none;border-radius:7px;font-size:12px;cursor:pointer;background:{{ thumbTabBg }};box-shadow:{{ thumbTabSh }};color:var(--ink, #1D1D1F)">缩略图</button><button onClick="{{ showOutline }}" style="height:24px;padding:0 10px;border:none;border-radius:7px;font-size:12px;cursor:pointer;background:{{ outlineTabBg }};box-shadow:{{ outlineTabSh }};color:var(--ink, #1D1D1F)">目录</button></div></sc-if>
        <sc-if value="{{ hasOutline }}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
        <button onClick="{{ closeThumbs }}" title="关闭" style="width:26px;height:26px;padding:0;border:none;border-radius:var(--ctl-r, 8px);background:transparent;font-size:11px;color:var(--ink-3, rgba(29,29,31,0.36));cursor:pointer;transition:background .2s,color .2s,transform .3s cubic-bezier(.2,1.4,.4,1)" style-hover="background:var(--fill, rgba(0,0,0,0.07));color:var(--ink-2, rgba(29,29,31,0.62))" style-active="transform:scale(0.88)">✕</button></div>
      <sc-if value="{{ outlineOn }}" hint-placeholder-val="{{ false }}">
        <div style="flex:1;min-height:0;overflow:auto;padding:0 10px 24px;display:flex;flex-direction:column;gap:1px">
          <sc-for list="{{ outlineItems }}" as="o" hint-placeholder-count="0">
            <div onClick="{{ o.onClick }}" title="{{ o.title }}" style="padding:5px 8px 5px {{ o.pad }};border-radius:var(--ctl-r, 8px);font-size:12.5px;line-height:1.35;cursor:pointer;color:{{ o.color }};background:{{ o.bg }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap" style-hover="background:var(--fill, rgba(0,0,0,0.07))">{{ o.title }}</div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ outlineOn }}" hint-placeholder-val="{{ true }}">
        <div style="flex:1;min-height:0;overflow:auto;padding:0 14px 24px;display:flex;flex-direction:column;gap:14px;align-items:center">
        <sc-for list="{{ pages }}" as="p" hint-placeholder-count="3">
          <div onClick="{{ p.onThumb }}" draggable="{{ true }}" onDragStart="{{ p.onDragStart }}" onDragOver="{{ p.onDragOver }}" onDrop="{{ p.onDrop }}" onDragEnd="{{ p.onDragEnd }}" title="拖动可调整页序" style="flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:grab;padding-top:6px;margin-top:-6px;border-top:{{ p.dropLine }}">
            <canvas ref="{{ p.tref }}" style="width:{{ p.tw }};height:{{ p.th }};background:var(--k51, #fff);border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,0.06),0 3px 10px rgba(0,0,0,0.06);outline:{{ p.tline }};outline-offset:3px;pointer-events:none"></canvas>
            <span style="font-size:11px;color:var(--ink-2, rgba(29,29,31,0.62))">{{ p.n }}</span>
          </div>
        </sc-for>
        </div>
      </sc-if>
      </div>
    </sc-if>
    <div ref="{{ scRef }}" onScroll="{{ onScroll }}" style="grid-column:2;overflow:auto;min-width:0;position:relative">
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div style="padding:40px;text-align:center;font-size:13px;color:var(--ink-3, rgba(29,29,31,0.36))">{{ loadText }}</div></sc-if>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:{{ scJ }};gap:20px;padding:{{ scPad }};min-width:max-content;min-height:{{ scMinH }};box-sizing:border-box">
        <sc-for list="{{ mainPages }}" as="p" hint-placeholder-count="0">
          <div data-page="{{ p.id }}" style="position:relative;width:{{ p.w }};height:{{ p.h }};background:var(--k51, #fff);box-shadow:var(--paper-sh, 0 0 0 1px rgba(0,0,0,0.05),0 10px 34px rgba(0,0,0,0.06));flex:none;outline:{{ p.line }}">
            <canvas ref="{{ p.ref }}" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
            <div onMouseDown="{{ p.onMD }}" style="position:absolute;inset:0;cursor:{{ cursor }};overflow:hidden">
              <div ref="{{ p.lref }}" class="pt-tl" style="width:{{ p.w0 }};height:{{ p.h0 }};transform:{{ p.ltf }};pointer-events:{{ tlPE }}"></div>
              <sc-for list="{{ p.items }}" as="t" hint-placeholder-count="0">
                <div onMouseDown="{{ t.onMD }}" title="点击修改这段文字" style="position:absolute;left:{{ t.x }};top:{{ t.y }};width:{{ t.w }};height:{{ t.h }};cursor:text;border-radius:2px" style-hover="background:color-mix(in srgb, var(--k59, #3F7D5C) 12%, transparent);box-shadow:0 0 0 1px var(--k59, #3F7D5C)"></div>
              </sc-for>
              <svg width="{{ p.sw }}" height="{{ p.sh }}" style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible">
                <sc-for list="{{ p.inks }}" as="k" hint-placeholder-count="0">
                  <polyline points="{{ k.pts }}" onMouseDown="{{ k.onMD }}" style="fill:none;stroke:{{ k.color }};stroke-width:{{ k.sw }};stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:move;filter:{{ k.glow }}"></polyline>
                </sc-for>
              </svg>
              <sc-for list="{{ p.annots }}" as="a" hint-placeholder-count="0">
                <div onMouseDown="{{ a.onMD }}" onDoubleClick="{{ a.onDbl }}" style="position:absolute;left:{{ a.x }};top:{{ a.y }};width:{{ a.w }};height:{{ a.h }};background:{{ a.bg }};opacity:{{ a.op }};mix-blend-mode:{{ a.blend }};border-radius:{{ a.radius }};box-shadow:{{ a.sh }};border:{{ a.border }};outline:{{ a.line }};outline-offset:1px;cursor:{{ a.cur }};box-sizing:border-box">
                  <sc-if value="{{ a.hasText }}" hint-placeholder-val="{{ false }}">
