    </div>

</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;doc&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(doc, opts) =&gt; void&quot;},&quot;onUndo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onRedo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onConvert&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(kind, payload) =&gt; void&quot;},&quot;toast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(msg) =&gt; void&quot;},&quot;showThumbs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pure&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggleThumbs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const md = e => e.preventDefault();
const TOOLS = [['select', '选择', 'V'], ['edit', '改文字', 'E'], ['text', '添加文字', 'T'], ['hl', '高亮', 'H'], ['rect', '方框', 'R'], ['ink', '画笔', 'P'], ['white', '遮盖', 'W']];
const HINTS = { select: '点击选中批注，拖动移动，双击编辑文字', edit: '点击页面上的原有文字即可修改', text: '在页面上点击添加文字', hl: '拖动框选要高亮的区域', rect: '拖动画一个方框', ink: '按住拖动自由绘制', white: '拖动遮盖不需要的内容' };

class Component extends DCLogic {
  state = { tool: 'select', scale: null, zoomEdit: null, view: 'continuous', color: '#B5563A', fs: 14, sel: null, editing: null, live: null, infos: {}, items: {}, cur: null, err: null };
  scRef = React.createRef(); cv = {}; tcv = {};

  componentWillUnmount() { window.removeEventListener('mousemove', this.onWM); window.removeEventListener('mouseup', this.onWU); if (this.rootEl) this.rootEl.removeEventListener('wheel', this.onWheel); }
  /** Continuous zoom, 20%–400%; `at` (client coords) is the point that stays put, default the viewport centre. */
  setZoom(z, at) {
    z = Math.max(ZMIN, Math.min(ZMAX, z)); const sc = this.scRef.current, z0 = this.state.scale || 1; if (!sc || Math.abs(z - z0) < 1e-4) return;
    const cr = sc.getBoundingClientRect(), ax = at ? at.x - cr.left : sc.clientWidth / 2, ay = at ? at.y - cr.top : sc.clientHeight / 2, r = z / z0, sx = sc.scrollLeft, sy = sc.scrollTop, pt = this.props.pure ? 28 : 72, pl = 24;

  go(dir) { const d = this.doc, i = d.pages.findIndex(p => p.id === this.state.cur), j = Math.max(0, Math.min(d.pages.length - 1, (i < 0 ? 0 : i) + dir)); if (d.pages[j]) this.scrollTo(d.pages[j].id); }
  setView(view) { const cur = this.state.cur || (this.doc.pages[0] && this.doc.pages[0].id); this.setState({ view, cur }, () => this.scrollTo(cur)); }
  componentDidUpdate(pp) {

      const u = { infos, err: null };

        const t = e.target; if (t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName)) { if (e.key === 'Escape' && t.isContentEditable) t.blur(); return; }
        const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
        if (ctrl && (e.key === '=' || e.key === '+' || e.key === 'Add')) { e.preventDefault(); this.setZoom((this.state.scale || 1) + 0.1); return; }
        if (ctrl && (e.key === '-' || e.key === 'Subtract')) { e.preventDefault(); this.setZoom((this.state.scale || 1) - 0.1); return; }
        if (ctrl && e.key === '0') { e.preventDefault(); this.setZoom(1); return; }
        if (!ctrl && (e.key === 'PageDown' || e.key === 'PageUp' || (single && /^Arrow(Down|Up|Right|Left)$/.test(e.key)))) { e.preventDefault(); this.go(/Down|Right/.test(e.key) ? 1 : -1); return; }
        if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? this.props.onRedo && this.props.onRedo() : this.props.onUndo && this.props.onUndo(); return; }
        if (ctrl && k === 'y') { e.preventDefault(); this.props.onRedo && this.props.onRedo(); return; }
        if (ctrl && k === 's') { e.preventDefault(); this.save(false); return; }
        if ((e.key === 'Delete' || e.key === 'Backspace') && selA) { e.preventDefault(); this.change(dd => { dd.annots = dd.annots.filter(a => a.id !== selA.id); }); this.setState({ sel: null }); return; }
        if (e.key === 'Escape') { this.setState({ sel: null, tool: 'select' }); return; }
        if (!ctrl) { const m = TOOLS.find(x => x[2].toLowerCase() === k); if (m) setTool(m[0]); }
      }
    };
  }
}
</script>
