[package]
name = "writer-desktop"
version = "0.1.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# in-app updates (src/update.rs); interface packages use the updater's HTTP client, signature check and archive format
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
minisign-verify = "0.2"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-uniform-type-identifiers", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSError", "NSString", "NSURL", "NSUserDefaults"] }
# 默认打开方式 (src/default_app.rs): the type of a file extension, and the answer of NSWorkspace's set-default call
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# 默认打开方式 (src/default_app.rs): the program the shell opens a file extension with
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[features]
# UI checks without Accessibility access, see test_plan() in src/main.rs
test-hooks = []
# Mac App Store build: no private API, so the settings/about/gestures panels are opaque windows
appstore = []

# Build scripts and proc macros stay unstripped: Xcode 27's strip leaves their dylibs with a LINKEDIT string pool that
# macOS 27's dyld refuses ("mis-aligned LINKEDIT string pool"), which rustc reports as "can't find crate". They never ship.
[profile.release.build-override]
strip = false
