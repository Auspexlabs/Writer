<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>Writer · 文件图标方案</title>
<meta name="description" content="比较 Writer 的 Word、Excel、Markdown、思维导图、PPT 与 PDF 图标方案。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../../brand/writer-mark.svg">
<style>
:root{color-scheme:light;--ink:#1d1d1f;--muted:#797981;--line:#e8e8ed;--sans:'IBM Plex Sans','Noto Sans SC',sans-serif;--serif:'Noto Serif SC','Songti SC',serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}button{font:inherit}a{color:inherit;text-decoration:none}.wrap{width:min(1210px,calc(100% - 64px));margin:auto}.topbar{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #efeff2}.topbar img{display:block;width:125px}.topbar a:last-child{font-size:13px;color:#77777e}.topbar a:last-child:hover{color:var(--ink)}.intro{padding:43px 0 31px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#a0a0a6;font-weight:600}h1{font-family:var(--serif);font-size:clamp(34px,4.2vw,53px);font-weight:600;letter-spacing:-.045em;margin:12px 0 9px}.intro p{font-size:14px;color:var(--muted);line-height:1.7;margin:0}.set{margin:0 0 39px}.set-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:20px 0 18px;border-top:1px solid var(--line)}.set-number{font-size:11px;letter-spacing:.14em;color:#aaaab0;font-weight:600}h2{font-size:21px;margin:5px 0 3px;font-weight:600}.set-heading p{font-size:12px;color:#8a8a91;margin:0}.choose-set{border:1px solid #dedee3;background:#fff;border-radius:999px;padding:9px 13px;color:#5f5f66;font-size:12px;cursor:pointer;white-space:nowrap}.choose-set:hover{background:#f7f7f9;color:#1d1d1f}.icon-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:11px}.icon-card{text-align:left;position:relative;display:block;min-width:0;padding:0;border:1px solid var(--line);border-radius:17px;background:#fff;cursor:pointer;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s}.icon-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,25,34,.07)}.icon-card[aria-pressed="true"]{border-color:#292a31;box-shadow:inset 0 0 0 1px #292a31,0 9px 23px rgba(20,25,34,.08)}.icon-card[aria-pressed="true"]:after{content:'✓';position:absolute;right:13px;top:13px;color:#fff;background:#292a31;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:12px}.icon-stage{height:116px;background:radial-gradient(circle at 74% 17%,#f0f3f9,transparent 40%),radial-gradient(circle at 22% 85%,#f8f3f0,transparent 43%),#fafafb;display:flex;align-items:center;justify-content:center;position:relative}.icon-stage .large{width:72px;height:72px;display:block}.icon-stage .small{position:absolute;left:13px;bottom:12px;width:22px;height:22px;display:block}.card-meta{display:flex;align-items:baseline;justify-content:space-between;gap:4px;padding:12px 13px 13px}.file-name{font-size:13px;font-weight:600;white-space:nowrap}.file-ext{font-size:10px;color:#a2a2a9;white-space:nowrap}.card-code{position:absolute;top:13px;left:13px;font-size:10px;color:#9a9aa3;letter-spacing:.08em}.selection{position:sticky;bottom:13px;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 13px 12px 18px;border:1px solid #e6e6eb;border-radius:15px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 10px 32px rgba(40,45,55,.11);margin:5px 0 35px}.selection-label{font-size:12px;color:#85858d;white-space:nowrap}#selection-text{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#copy-selection{padding:9px 14px;border:0;border-radius:10px;background:#27272b;color:#fff;font-size:12px;cursor:pointer;white-space:nowrap}#copy-selection:disabled{background:#dedee2;color:#8a8a92;cursor:default}.note{font-size:12px;line-height:1.6;color:#a0a0a7;margin:0 0 45px}@media(max-width:1000px){.icon-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.wrap{width:calc(100% - 34px)}.topbar{height:71px}.topbar img{width:93px}.intro{padding:31px 0 25px}.intro p{font-size:13px}.set{margin-bottom:31px}.set-heading{align-items:center}.set-heading p{max-width:240px;line-height:1.5}.icon-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.icon-stage{height:103px}.icon-stage .large{width:66px;height:66px}.selection{bottom:9px;gap:8px;padding:10px}.selection-label{display:none}#selection-text{font-size:11px}#copy-selection{padding:8px 10px;font-size:11px}}
</style></head><body>
<header class="topbar wrap"><a href="/"><img src="../../brand/writer-logo.svg" alt="Writer"></a><a href="/">返回官网 ↗</a></header>
<main class="wrap"><div class="intro"><span class="eyebrow">WRITER / FILE ICON STUDY</span><h1>六种文件，两套图标。</h1><p>保留雾彩玻璃与深色几何两套。Markdown 改成与两套风格一致的排版字形与输入光标，PDF 进一步变细；大图看造型，左下角小图看小尺寸效果。</p></div>
<section class="set" aria-labelledby="set-B"><div class="set-heading"><div><span class="set-number">SET B</span><h2 id="set-B">雾彩玻璃</h2><p>低饱和颜色与半透明底，延续界面的毛玻璃质感。</p></div><button class="choose-set" type="button" data-set="B">选整套 B ↗</button></div><div class="icon-grid"><button class="icon-card" type="button" data-type="word" data-code="B1" aria-pressed="false" aria-label="选择 Word 的 B1 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/b-glass/word.svg" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/b-glass/word.svg" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">Word</span><span class="file-ext">.docx</span></span><span class="card-code">B1</span></button><button class="icon-card" type="button" data-type="excel" data-code="B2" aria-pressed="false" aria-label="选择 Excel 的 B2 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/b-glass/excel.svg" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/b-glass/excel.svg" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">Excel</span><span class="file-ext">.xlsx</span></span><span class="card-code">B2</span></button><button class="icon-card" type="button" data-type="markdown" data-code="B3" aria-pressed="false" aria-label="选择 Markdown 的 B3 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/b-glass/markdown.svg?v=8" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/b-glass/markdown.svg?v=8" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">Markdown</span><span class="file-ext">.md</span></span><span class="card-code">B3</span></button><button class="icon-card" type="button" data-type="mindmap" data-code="B4" aria-pressed="false" aria-label="选择 思维导图 的 B4 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/b-glass/mindmap.svg" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/b-glass/mindmap.svg" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">思维导图</span><span class="file-ext">.mm</span></span><span class="card-code">B4</span></button><button class="icon-card" type="button" data-type="ppt" data-code="B5" aria-pressed="false" aria-label="选择 PPT 的 B5 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/b-glass/ppt.svg" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/b-glass/ppt.svg" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">PPT</span><span class="file-ext">.pptx</span></span><span class="card-code">B5</span></button><button class="icon-card" type="button" data-type="pdf" data-code="B6" aria-pressed="false" aria-label="选择 PDF 的 B6 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/b-glass/pdf.svg?v=5" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/b-glass/pdf.svg?v=5" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">PDF</span><span class="file-ext">.pdf</span></span><span class="card-code">B6</span></button></div></section><section class="set" aria-labelledby="set-C"><div class="set-heading"><div><span class="set-number">SET C</span><h2 id="set-C">深色几何</h2><p>强识别的深色底，在工具栏和侧栏里更醒目。</p></div><button class="choose-set" type="button" data-set="C">选整套 C ↗</button></div><div class="icon-grid"><button class="icon-card" type="button" data-type="word" data-code="C1" aria-pressed="false" aria-label="选择 Word 的 C1 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/c-solid/word.svg" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/c-solid/word.svg" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">Word</span><span class="file-ext">.docx</span></span><span class="card-code">C1</span></button><button class="icon-card" type="button" data-type="excel" data-code="C2" aria-pressed="false" aria-label="选择 Excel 的 C2 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/c-solid/excel.svg" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/c-solid/excel.svg" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">Excel</span><span class="file-ext">.xlsx</span></span><span class="card-code">C2</span></button><button class="icon-card" type="button" data-type="markdown" data-code="C3" aria-pressed="false" aria-label="选择 Markdown 的 C3 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/c-solid/markdown.svg?v=8" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/c-solid/markdown.svg?v=8" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">Markdown</span><span class="file-ext">.md</span></span><span class="card-code">C3</span></button><button class="icon-card" type="button" data-type="mindmap" data-code="C4" aria-pressed="false" aria-label="选择 思维导图 的 C4 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/c-solid/mindmap.svg" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/c-solid/mindmap.svg" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">思维导图</span><span class="file-ext">.mm</span></span><span class="card-code">C4</span></button><button class="icon-card" type="button" data-type="ppt" data-code="C5" aria-pressed="false" aria-label="选择 PPT 的 C5 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/c-solid/ppt.svg" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/c-solid/ppt.svg" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">PPT</span><span class="file-ext">.pptx</span></span><span class="card-code">C5</span></button><button class="icon-card" type="button" data-type="pdf" data-code="C6" aria-pressed="false" aria-label="选择 PDF 的 C6 方案"><span class="icon-stage"><img class="large" src="assets/icon-concepts/c-solid/pdf.svg?v=5" width="72" height="72" alt=""><img class="small" src="assets/icon-concepts/c-solid/pdf.svg?v=5" width="22" height="22" alt=""></span><span class="card-meta"><span class="file-name">PDF</span><span class="file-ext">.pdf</span></span><span class="card-code">C6</span></button></div></section>
<div class="selection" aria-live="polite"><span class="selection-label">当前选择</span><span id="selection-text">尚未选择；点击喜欢的图标。</span><button id="copy-selection" type="button" disabled>复制选择</button></div>
<p class="note">均为原创 SVG 概念图。选定后再统一调整颜色、线宽和小尺寸细节，用于软件与官网。</p>
</main>
<script>
const selection=new Map();
const names={word:'Word',excel:'Excel',markdown:'Markdown',mindmap:'思维导图',ppt:'PPT',pdf:'PDF'};
const order=['word','excel','markdown','mindmap','ppt','pdf'];
const cards=[...document.querySelectorAll('.icon-card')];
const output=document.getElementById('selection-text');
const copy=document.getElementById('copy-selection');
function render(){for(const card of cards)card.setAttribute('aria-pressed',selection.get(card.dataset.type)===card.dataset.code?'true':'false');const parts=order.filter(k=>selection.has(k)).map(k=>`${names[k]} ${selection.get(k)}`);output.textContent=parts.length?parts.join(' · '):'尚未选择；点击喜欢的图标。';copy.disabled=!parts.length}
for(const card of cards)card.addEventListener('click',()=>{const type=card.dataset.type,code=card.dataset.code;if(selection.get(type)===code)selection.delete(type);else selection.set(type,code);render()});
for(const button of document.querySelectorAll('.choose-set'))button.addEventListener('click',()=>{const letter=button.dataset.set;for(const card of cards)if(card.dataset.code.startsWith(letter))selection.set(card.dataset.type,card.dataset.code);render()});
copy.addEventListener('click',async()=>{const text='Writer 图标选择：'+order.filter(k=>selection.has(k)).map(k=>`${names[k]} ${selection.get(k)}`).join('、');try{await navigator.clipboard.writeText(text);copy.textContent='已复制 ✓';setTimeout(()=>copy.textContent='复制选择',1800)}catch{copy.textContent='请手动复制';setTimeout(()=>copy.textContent='复制选择',1800)}});
</script></body></html>
